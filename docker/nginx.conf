# =============================================================================
# nginx configuration for the DnnMigration Angular 19 SPA.
#
# Served by the nginx:alpine runtime stage of docker/frontend.Dockerfile, which
# runs `COPY docker/nginx.conf /etc/nginx/nginx.conf`. THIS FILE IS MANDATORY:
# because that Dockerfile copies it, its absence kills the frontend image build
# at the COPY step and fails the container build gate. It lands at
# /etc/nginx/nginx.conf, i.e. it is the MAIN configuration rather than a drop-in
# server fragment, which is why the top-level `events` block below is required
# and not decoration - nginx refuses to start a main configuration without one.
#
# NO TLS TERMINATES IN THE SHIPPED IMAGE, AND NOTHING HERE READS A COMPOSE SECRET.
# An earlier revision stated the opposite - that this file terminated TLS from a
# certificate pair delivered as read-only compose secrets, that 4200 existed only to
# redirect to a published 4443, and that the API was not published on the host - and
# none of it was true of the delivered artefacts: this file declares one `listen 80`
# server plus two wildcard includes that match no file in the image, it names no
# /run/secrets path, and docker-compose.yml publishes the API on 127.0.0.1:8080
# because AAP 0.9.4 gate 7 probes it there. The secret references that revision left
# behind in the compose file made it an INVALID PROJECT that would not parse, so the
# container gates could not run at all until they were withdrawn. The accurate
# statement is below: TLS terminates at the browser-facing EDGE - either an ingress
# in front of this container, or this server once a deployment mounts a certificate -
# and the base topology serves plain HTTP on the loopback addresses the gate probes.
#
# TRANSPORT POLICY - browser traffic is HTTPS-only, and this file enforces it.
#   TLS terminates at the browser-facing EDGE, which is either this server or an
#   ingress in front of it, and never inside the API container - that one speaks
#   plain HTTP on the internal network by design.
#
#   Three mechanisms implement the policy, and none of them needs a certificate
#   to be baked into this image:
#     1. $edge_scheme resolves the scheme the BROWSER used. When an outer ingress
#        terminates TLS it declares that in a forwarded header; with no such hop
#        the scheme this server accepted is the truth. Everything below reads that
#        one variable rather than guessing.
#     2. A plain-HTTP request for any address other than a loopback one is
#        answered with a redirect to the same URL over HTTPS. The loopback
#        exemption is not a loophole: such a request never leaves the machine that
#        made it, so there is no network on which it could be observed, and it is
#        what keeps this image's own health probe, the compose topology's probe and
#        the end-to-end gate working - each of them addresses 127.0.0.1 or
#        localhost over plain HTTP. It is the same carve-out the API's transport
#        stage and the .NET strict-transport-security default both make.
#     3. Strict transport security is emitted ONLY when the edge scheme is HTTPS.
#        Over plain HTTP the header is ignored by the browser and misleading to an
#        operator reading a response, so its value resolves to the empty string and
#        nginx omits it entirely.
#
#   Certificates are PROVISIONED OUTSIDE THIS IMAGE, and there are three supported
#   ways to satisfy the policy:
#     (a) Front this container with a TLS-terminating ingress. Nothing has to be
#         mounted here: the ingress forwards the scheme, mechanism 1 picks it up,
#         and mechanisms 2 and 3 follow. This is the arrangement docker-compose.yml
#         describes, and a deployment reached at a real host name MUST provide it -
#         without it every browser request is answered with a redirect it cannot
#         satisfy, which is the intended, loud failure rather than a silent
#         downgrade to clear text.
#     (b) Terminate TLS here by mounting a server FRAGMENT into
#         /etc/nginx/transport-policy/ that adds `listen 443 ssl;` and the
#         certificate directives to the server below - see the include there. The
#         glob matches nothing in the shipped image and nginx accepts an include
#         that matches no file, so the default topology starts unchanged.
#     (c) Terminate TLS here by mounting a COMPLETE server block into
#         /etc/nginx/tls/ - the http-level include below loads it.
#         docker/nginx.tls.conf is the ready-made block, and
#         docker/docker-compose.tls.yml mounts it, publishes 443 and withdraws the
#         API's own published port so the API is reachable only on the internal
#         network. Neither file changes anything here, and this glob likewise
#         matches nothing in the shipped image. docker/nginx.tls.conf.example
#         documents the same route for a deployment that would rather write its own
#         block than mount the ready-made one.
#
# THE EXACT PERMITTED DELTA FROM THE SUPPLIED EXAMPLE, AND THE AUTHORITY FOR IT.
# AAP 0.9.3 supplies this file's directive inventory; AAP 0.9.6 separately makes
# this file the home of the "content-security headers" non-functional
# requirement ("Angular's built-in sanitisation plus header configuration in the
# supplied proxy config"). The two are reconciled the only way they can be: every
# directive the inventory names is present and unchanged - worker_connections
# 1024, the SPA fallback, the /api/ proxy with its six forwarded headers, and the
# one-year immutable asset policy - and the delta is confined to additions that
# 0.9.6 mandates or that a Linux container demonstrably requires. The complete
# list of additions is:
#   1. Response security headers, including the content security policy required
#      by 0.9.6, and strict transport security emitted only on a TLS request.
#   2. The optional TLS include below, so TLS can be terminated in THIS proxy.
#   3. An access-log format that omits the query string and the caller's
#      metadata (see the note above log_format).
#   4. The events block, the mime.types include and the IPv6 listener, each of
#      which is required for nginx to start or to serve correctly in this image.
# Nothing the inventory names is removed, reordered or weakened. Every item above
# is recorded in MIGRATION_NOTES.md under the container-example heading.
#
# TRANSPORT SECURITY IS TERMINATED HERE WHEN A CERTIFICATE IS SUPPLIED, BY ROUTE
# (c) ABOVE. The http-level include below draws in every *.conf file mounted at
# /etc/nginx/tls/ - that exact path, matching the include as written; an earlier
# revision of this note said /etc/nginx/tls.d/, which no directive in this file has
# ever loaded. A wildcard include that matches nothing is not an error in nginx, so
# the image starts with no certificate present - which is what keeps the end-to-end
# gate's plain-HTTP probe of this server working - and the SAME image serves HTTPS
# the moment a certificate and a server block are mounted there. No certificate, key
# or passphrase is committed to this repository, and none may be.
#
# THE PLAIN-HTTP LISTENER BELOW IS NOT THE PRODUCTION POSTURE ON ITS OWN. It
# exists because AAP 0.9.4 gate 7 probes "curl -f http://localhost:4200" and the
# supplied docker-compose.yml publishes 4200:80, so an HTTP listener that
# redirected or refused would fail an acceptance criterion of this migration. A
# deployment that faces the public internet mounts the TLS snippet and terminates
# TLS here (or in front of this container); the API refuses cleartext by default
# outside development and honours this proxy's X-Forwarded-Proto once the
# deployment names this hop as trusted.
#
# Deliberately absent, each for a reason:
#   - No certificate, key or TLS listener IN THIS FILE. Committing a certificate
#     is never acceptable, and declaring a TLS listener whose certificate is
#     absent makes nginx fail to START - which would fail the container gate
#     rather than harden anything. Hence the mount point described above.
#   - No `upgrade-insecure-requests` in the content security policy. It would
#     rewrite every subresource request of a plain-HTTP document to HTTPS, which
#     on the loopback path above means rewriting them to a port nothing listens
#     on. The redirect is the right tool for that job and is already applied.
#   - No cross-origin response headers - see the API proxy note below.
#   - No load-balancing pool, no dynamic DNS lookup, no rate limiting, and no
#     health-probe location. Rate limiting belongs to the API
#     (Extensions/RateLimitingExtensions.cs), and its health endpoint is
#     anonymous and published on its own port, so it is probed directly rather
#     than through this proxy.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Load-bearing. Without this include every response would be labelled with
    # the default_type below, the browser would refuse to execute the JavaScript
    # bundle, and the SPA would render a blank page - while `curl -f` still
    # reported 200. That makes omitting it invisible to the end-to-end gate,
    # which is exactly why it is never optional.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    # An exact version string in a response header is free reconnaissance for
    # anyone matching a server against known advisories.
    server_tokens      off;

    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_comp_level    6;
    # text/html is always compressed and listing it again is a duplicate-type
    # error. Already-compressed binaries are omitted on purpose: recompressing
    # them spends CPU and returns nothing.
    gzip_types         text/plain text/css text/xml text/javascript
                       application/json application/javascript
                       application/xml application/xml+rss
                       image/svg+xml;

    # $http_x_correlation_id closes the loop that the SPA's correlation-id
    # interceptor opens and the API's CorrelationIdMiddleware consumes, so a
    # single identifier ties one proxy record to its API log entries. In
    # nginx:alpine both paths below are symlinks to the container's standard
    # output and error, so records reach `docker logs` and no file grows inside
    # the container.
    #
    # THE QUERY STRING IS NOT RECORDED, and that is a privacy requirement rather
    # than a preference. $request carries the whole request line INCLUDING the
    # query, and the account-listing endpoints accept e-mail address and profile
    # filters as query values - so recording it would deposit personal data into
    # proxy logs whose retention and access are outside the application's
    # control.
    #
    # $request_path below is the ORIGINAL request path with everything from the
    # first question mark onwards discarded. $uri would also be query-free but is
    # the path AFTER internal rewriting, so every deep link into the application
    # would be recorded as /index.html by the single-page fallback and an operator
    # could no longer tell which screen a caller asked for. Discarding the query
    # from the original path keeps the diagnostic value and drops the personal
    # data.
    #
    # The ERROR log is a different matter and cannot be formatted: nginx writes
    # the whole request line, query included, for a request that failed. It is
    # left at `warn` for exactly that reason - it records faults rather than
    # traffic - and a deployment with a strict data policy routes it accordingly.
    #
    # RETENTION AND ACCESS. Both paths are the container's standard streams, so
    # these records live exactly as long as the deployment's log collector keeps
    # them and are readable by whoever can read container output. A deployment
    # subject to a retention policy configures it there; nothing is written to a
    # file inside the container, so nothing accumulates unmanaged.
    # The original path, with the query removed. The pattern is anchored and
    # matches greedily up to the first question mark, so a path containing an
    # encoded question mark is still recorded whole while a real query is always
    # dropped.
    map $request_uri $request_path {
        ~^(?<path_only>[^?]*)  $path_only;
        default                "-";
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $request_path" $status $body_bytes_sent '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '"$http_x_correlation_id"';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # A TLS server block mounted here is loaded; nothing mounted is not an error.
    # See the transport-security note in this file's header.
    include /etc/nginx/tls/*.conf;

    # ---- Transport and response policy --------------------------------------
    # Declared once, here, and consumed by variable everywhere below. Repeating a
    # policy string in each of the three header sets would let the copies drift,
    # and a drifted content security policy is worse than none: the strictest copy
    # decides, so one stale entry breaks the application on whichever path carries
    # it. A map cannot be empty by accident either - it always resolves to its
    # default - which is the property an omitted-header failure mode needs.

    # The scheme the BROWSER used to reach the edge. With no forwarding hop the
    # scheme this server accepted is the truth; with one, its declaration wins.
    # Only the two real values are honoured, so a caller sending anything else
    # falls back to the observed scheme rather than choosing its own answer.
    map $http_x_forwarded_proto $edge_scheme {
        default   $scheme;
        "http"    http;
        "https"   https;
    }

    # Whether the request names an address reachable only from the machine that
    # issued it. $host carries the host WITHOUT the port, which is what makes a
    # single entry cover every port a loopback address may be published on.
    map $host $loopback_addressed {
        default       0;
        "localhost"   1;
        "127.0.0.1"   1;
        "::1"         1;
        "[::1]"       1;
    }

    # The redirect decision. One combination redirects: a non-loopback address
    # reached over plain HTTP. Everything else - already HTTPS, or loopback -
    # resolves to 0, which is why this server keeps answering the container health
    # probe and the end-to-end gate exactly as it did before.
    map "$loopback_addressed:$edge_scheme" $enforce_https {
        default    0;
        "0:http"   1;
    }

    # Strict transport security, and only over HTTPS. nginx omits an add_header
    # whose value resolves to the empty string, so the default below is what keeps
    # the header off a plain-HTTP response rather than a second conditional.
    # One year with subdomains included, and deliberately NOT `preload`: browser
    # preload lists are effectively irreversible and are not a decision a
    # container image may take on a deployment's behalf.
    map $edge_scheme $hsts_policy {
        default   "";
        "https"   "max-age=31536000; includeSubDomains";
    }

    # The content security policy for the single-page application. Keyed on a
    # variable only because a map needs a source; the value is the same for every
    # request, which is the point - one definition, three consumers.
    #
    # Every directive here was verified against the ACTUAL production bundle this
    # image serves, not assumed:
    #   * script-src 'self' with NO 'unsafe-inline' and NO 'unsafe-eval'. The
    #     built document carries no inline script and no inline event-handler
    #     attribute, which is only true because the production build disables
    #     critical-CSS inlining (frontend/angular.json). With that optimisation on,
    #     the builder emits `<link ... media="print" onload="this.media='all'">`,
    #     an inline handler that this directive blocks - and the failure is
    #     invisible to a status-code probe, because the document still returns 200
    #     while rendering with only its inlined critical styles. Turning the
    #     optimisation off is what buys a script policy with no exception in it.
    #   * style-src 'self' 'unsafe-inline' - the one exception in this policy, and
    #     it is narrow and unavoidable. Angular injects each component's styles at
    #     run time as a `<style>` element, which CSP counts as an inline
    #     stylesheet; removing the exception would strip every component of its
    #     styling. Eliminating it needs a per-response nonce threaded into the
    #     document and the framework's nonce attribute, which requires a templated
    #     index document this image does not have. Style injection cannot execute
    #     script, so the exception does not weaken the script policy.
    #   * connect-src 'self' - the bundle is built with the RELATIVE API base
    #     /api/v1 and reaches the API through the proxy below, so every request it
    #     makes is same-origin. A deployment that moved the API to another origin
    #     would have to name it here, and having to do so is the point.
    #   * img-src 'self' data: - no stylesheet in the bundle references a URL of
    #     any kind, so this is headroom for inline SVG and generated previews
    #     rather than a current requirement; a data URL cannot execute script.
    #   * object-src 'none' and frame-src 'none' - this application embeds no
    #     plugin and no frame, and both are classic injection surfaces.
    #   * base-uri 'self' - the document declares `<base href="/">`, which the
    #     router builds every URL from; without this directive an injected `<base>`
    #     could repoint every relative request at another origin.
    #   * frame-ancestors 'self' - the modern counterpart of the frame-options
    #     header below, which is kept alongside it for browsers that read only
    #     that one.
    #   * form-action 'self' - the application posts through the API rather than
    #     through form submission, so nothing legitimate is refused.
    map $edge_scheme $content_security_policy {
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    }

    server {
        # EXPLICITLY THE DEFAULT SERVER FOR PORT 80, and the keyword is load-bearing.
        #
        # MIGRATION: without it, mounting a TLS server block by route (c) silently
        #   changed what this topology does with an unmatched host. The http-level
        #   include that loads such a block sits ABOVE this server, and nginx makes the
        #   FIRST server listening on an address the default for it - so
        #   docker/nginx.tls.conf's own `listen 80` redirect server, scoped to the
        #   deployment's name, became the catch-all for port 80 and answered the
        #   container's own health probe with a redirect to HTTPS. The probe is
        #   `wget --spider http://127.0.0.1:80/nginx-health`, so it followed the
        #   redirect, could not verify the deployment's certificate for 127.0.0.1, and
        #   exited non-zero: the frontend container reported UNHEALTHY for its whole
        #   life the moment TLS was activated, which is exactly the state
        #   `condition: service_healthy` holds a dependent service behind. Measured,
        #   not deduced. Naming the default here makes it independent of include order
        #   and of whatever a deployment mounts: the probe and every unmatched host
        #   land in this server, where the loopback exemption applies, while a browser
        #   asking for the deployment's own name still matches the mounted block.
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        # TLS termination in THIS container, when a deployment chooses option (b)
        # in the transport-policy note at the top of this file. The glob matches
        # nothing in the shipped image and nginx accepts an include that matches no
        # file, so the default topology is unaffected; mounting one fragment here
        # that adds `listen 443 ssl;` with `ssl_certificate` and
        # `ssl_certificate_key` is the whole change. Nothing else in this file has
        # to be touched: $edge_scheme then reports https for a request that arrived
        # on the TLS listener, so the redirect stands down and strict transport
        # security switches itself on. It is included INSIDE the server rather than
        # in the http block above because those are server-scoped directives.
        include      /etc/nginx/transport-policy/*.conf;

        # docker/frontend.Dockerfile copies the production build output
        # (/app/dist/dnn-migration/browser) to exactly this path.
        root         /usr/share/nginx/html;
        index        index.html;

        # Browser traffic is HTTPS-only - see the transport-policy note at the top
        # of this file for the three mechanisms and the loopback exemption. This is
        # the whole of the enforcement: one variable, decided once in the map above,
        # so the rule cannot be stated differently in two places.
        #
        # 307 rather than 301 or 308, and that is deliberate. A permanent redirect
        # is cached by the browser and by every intermediary between it and this
        # server, so a deployment that has to answer over plain HTTP again - during
        # a certificate replacement, or after moving TLS termination - would stay
        # unreachable for callers holding the cached answer, with nothing it could
        # do about it. 307 enforces the identical policy on every request while
        # remaining reversible, and it preserves the method and the body. The
        # permanence a deployment does want is expressed by strict transport security
        # instead, which carries a bounded lifetime.
        #
        # THE TWO EDGES DELIBERATELY DIFFER, AND AN EARLIER NOTE HERE WRONGLY CLAIMED
        # THEY AGREED. The API's own transport stage returns 308 - see
        # Api/Extensions/ServiceCollectionExtensions.cs, AddTransportSecurity, where
        # the 307 alternative is set out and answered - and this server returns 307.
        # Both codes preserve the method and the body, which is the property that
        # matters, so the difference is one of cacheability alone, and the two edges do
        # not face the same caller. THIS server is the browser-facing one: its answer
        # is cached by real browsers and by every intermediary on the path, so
        # reversibility is worth having. The API's stage is a defence-in-depth backstop
        # on the private container network, addressed by this proxy rather than by a
        # browser, where a permanent answer is both the honest description of a
        # perimeter that terminates TLS and free of the cache blast radius that makes
        # permanence costly here.
        #
        # $http_host, not $host: the port has to survive into the redirect target or
        # a browser reaching a non-default port would be sent to the default one.
        if ($enforce_https) {
            return 307 https://$http_host$request_uri;
        }

        # Response hardening. Mind nginx's inheritance rule: an add_header in a
        # location REPLACES the server-level set rather than adding to it, so
        # these five are repeated in the two locations below that declare a
        # Cache-Control of their own. Without that repetition the HTML document
        # - the one response where framing, MIME-sniffing and content-security
        # protection matter most - would carry none of them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $content_security_policy always;
        add_header Strict-Transport-Security $hsts_policy always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

        # ---- REST API reverse proxy --------------------------------------
        # `api` is the SERVICE NAME declared in docker/docker-compose.yml,
        # resolved by Docker's embedded DNS on the compose network. It is not a
        # name of this container: the loopback address here is nginx itself.
        #
        # This block is the ONLY path from the SPA to the API, because the
        # production Angular bundle sets apiBaseUrl to the RELATIVE '/api/v1'
        # (frontend/src/environments/environment.ts) so the browser addresses
        # only the origin that served the application. An absolute base URL
        # would resolve solely inside the Docker network and fail from the
        # browser - both containers healthy, application entirely non-functional,
        # and no build step the wiser. Keeping every call same-origin is also
        # why no cross-origin response header appears here: there is no
        # cross-origin request to authorise. That policy is configured API-side
        # in Extensions/CorsExtensions.cs.
        #
        # Both the location and the proxy_pass target end in '/'. That pair
        # tells nginx to REPLACE the matched prefix, so /api/v1/portals is
        # forwarded as http://api:8080/api/v1/portals. Drop either slash and
        # every path in the application is silently mangled.
        location /api/ {
            proxy_pass         http://api:8080/api/;
            proxy_http_version 1.1;

            # Upgrade and Connection are meaningful only over HTTP/1.1, which
            # the line above selects; nginx proxies with HTTP/1.0 by default and
            # that version cannot negotiate a connection upgrade.
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            # $http_host - the Host header EXACTLY as the browser sent it,
            # including the port - rather than nginx's default $proxy_host or the
            # port-stripped $host. The API resolves the tenant by exact-matching
            # host[:port] against dbo.PortalAlias, so three things are true at
            # once: the upstream's own name owns no alias row and identifies no
            # tenant; $host would silently drop the port, so an alias configured
            # as admin.example.com:4200 would arrive as admin.example.com and
            # fail to resolve; and only the unmodified header matches an alias
            # for every port a deployment may publish. Verified by experiment
            # rather than assumed: authenticating with the forwarded browser host
            # resolves the portal and returns 200, while the same request
            # carrying the upstream's own name as Host is refused with 400. This
            # one line is what makes tenancy work through the proxy.
            #
            # It is also why the API refuses a FORWARDED host header while
            # accepting a forwarded address and scheme: the Host it receives here
            # selects a tenant, so it must be set by this proxy and never by a
            # caller.
            proxy_set_header   Host              $http_host;

            # The caller's address and original scheme. SEC-022: the API DOES
            # consume these now, through the forwarded-headers stage, but only
            # when it has been told which proxies to trust - it reads
            # Proxy__KnownProxies / Proxy__KnownNetworks and, with neither set,
            # leaves both headers as untrusted text. So this side sends them
            # unconditionally and the trust decision lives entirely with the
            # deployment: docker-compose.tls.yml names this proxy's network,
            # which is what turns X-Forwarded-Proto into the scheme HTTPS
            # redirection and HSTS act on, and X-Forwarded-For into the address
            # the credential rate limiter partitions by. Without that setting
            # every proxied request would otherwise share one bucket, because
            # they all arrive from this container's address.
            # The caller's address and the scheme the BROWSER used. Both are
            # consumed upstream: the API's forwarded-header stage reads them to
            # partition its credential rate limiter per caller rather than per
            # proxy, to attribute a request to its real source, and to decide
            # whether the exchange reached the edge over TLS. Which hops it
            # believes is configured there (Proxy:KnownNetworks), so a deployment
            # whose container network differs from the shipped one names its own.
            #
            # $edge_scheme rather than $scheme, so an outer ingress that
            # terminated TLS is reported honestly instead of being flattened to
            # the plain HTTP hop between it and this server - which the API would
            # otherwise answer with a redirect the browser has already satisfied.
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $edge_scheme;
        }

        # ---- Container health probe ---------------------------------------
        # An exact-match location so the compose health check reads a fixed,
        # dependency-free answer from nginx itself rather than the SPA document
        # the fallback below would otherwise return for any path. Its access log
        # is off: a probe every few seconds is not a request anybody audits.
        location = /nginx-health {
            access_log   off;
            default_type text/plain;
            return       200 "healthy\n";
        }

        # ---- Immutable static assets --------------------------------------
        # A year is safe because frontend/angular.json sets outputHashing to
        # "all", so every bundle filename embeds a content hash and a new build
        # produces new filenames - a stale hit is impossible by construction.
        # index.html is deliberately NOT in this list: it is the one file that
        # must always be revalidated, because it is what tells the browser the
        # new hashed names.
        #
        # No try_files and no fallback here. A missing asset must return a
        # genuine 404, never an HTML document dressed up as a script.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $content_security_policy always;
            add_header Strict-Transport-Security $hsts_policy always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header X-Permitted-Cross-Domain-Policies "none" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
            access_log off;
        }

        # ---- SPA fallback --------------------------------------------------
        # The application routes its paths client-side, so a refresh or a deep
        # link on, say, /users/42/profile asks nginx for something that does not
        # exist on disk. Serving index.html hands the path to the Angular router
        # instead of returning 404 on every deep link.
        location / {
            try_files $uri $uri/ /index.html;

            # index.html must never be cached: it is the document that points
            # the browser at the current hashed bundles.
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $content_security_policy always;
            add_header Strict-Transport-Security $hsts_policy always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header X-Permitted-Cross-Domain-Policies "none" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        }
    }
}
