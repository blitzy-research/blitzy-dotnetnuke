# =============================================================================
# nginx configuration for the DnnMigration Angular SPA (AAP 0.9.3).
#
# MANDATORY FILE: docker/frontend.Dockerfile COPYs it, so the frontend image
# build fails at that COPY step if this file is missing.
#
# Because /api/ is proxied to the API container from the SAME origin that serves
# the SPA, the production Angular environment must use the RELATIVE base URL
# '/api/v1' - an absolute http://api:8080 would only resolve inside the Docker
# network and would fail from the browser.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml application/xml+rss image/svg+xml;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" "$http_x_correlation_id"';
    access_log  /var/log/nginx/access.log main;
    error_log   /var/log/nginx/error.log warn;

    server {
        listen       80;
        # Dual-stack listener: `localhost` resolves to ::1 first inside Alpine, so an
        # IPv4-only listener makes the container HEALTHCHECK (and any IPv6 client)
        # fail with "connection refused". Verified by runtime validation.
        listen       [::]:80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # Content-security headers (non-functional requirement).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---- REST API reverse proxy -------------------------------------
        location /api/ {
            proxy_pass         http://api:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # ---- API health probe (used for diagnostics from the SPA host) ---
        location = /health {
            proxy_pass         http://api:8080/health;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---- immutable static assets ------------------------------------
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ---- SPA fallback ------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
