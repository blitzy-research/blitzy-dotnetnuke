# =============================================================================
# nginx configuration for the DnnMigration Angular 19 SPA.
#
# Served by the nginx:alpine runtime stage of docker/frontend.Dockerfile, which
# runs `COPY docker/nginx.conf /etc/nginx/nginx.conf`. THIS FILE IS MANDATORY:
# because that Dockerfile copies it, its absence kills the frontend image build
# at the COPY step and fails the container build gate. It lands at
# /etc/nginx/nginx.conf, i.e. it is the MAIN configuration rather than a drop-in
# server fragment, which is why the top-level `events` block below is required
# and not decoration - nginx refuses to start a main configuration without one.
#
# NO TLS TERMINATES IN THE SHIPPED IMAGE, AND NOTHING HERE READS A COMPOSE SECRET.
# An earlier revision stated the opposite - that this file terminated TLS from a
# certificate pair delivered as read-only compose secrets, that 4200 existed only to
# redirect to a published 4443, and that the API was not published on the host - and
# none of it was true of the delivered artefacts: this file declares one `listen 80`
# server plus two wildcard includes that match no file in the image, it names no
# /run/secrets path, and docker-compose.yml publishes the API on 127.0.0.1:8080
# because AAP 0.9.4 gate 7 probes it there. The secret references that revision left
# behind in the compose file made it an INVALID PROJECT that would not parse, so the
# container gates could not run at all until they were withdrawn. The accurate
# statement is below: TLS terminates at the browser-facing EDGE - either an ingress
# in front of this container, or this server once a deployment mounts a certificate -
# and the base topology serves plain HTTP on the loopback addresses the gate probes.
#
# TRANSPORT POLICY IS NOT DECIDED IN THIS FILE, AND THAT IS THE CORRECTION.
#   An earlier revision enforced HTTPS here, and it decided which requests to
#   exempt from a value the CALLER sends:
#     * `map $http_x_forwarded_proto $edge_scheme` promoted a caller-supplied
#       header into the variable every decision below read, so any plain-HTTP
#       client could send `X-Forwarded-Proto: https` and skip the redirect
#       entirely - and the same variable was then forwarded to the API as its
#       own X-Forwarded-Proto, so the spoof propagated one hop further.
#     * `map $host $loopback_addressed` exempted a request whose Host authority
#       named localhost or a loopback literal. Host is chosen by the caller, so a
#       remote client reaching the published listener could send `Host: localhost`
#       and be served the application over cleartext.
#   Both maps and the redirect they drove are REMOVED. What replaces them is not a
#   patched-up version of the same decision; it is the recognition that this file
#   is the supplied proxy example (AAP 0.9.3) and that transport policy was never
#   part of its inventory. This server serves the single-page application, proxies
#   /api/ and reports the scheme it ACTUALLY accepted. Nothing here reads a
#   forwarded header, so nothing here can be told what to believe.
#
#   WHERE THE POLICY LIVES INSTEAD. TLS terminates at the browser-facing EDGE,
#   which is either an ingress in front of this container or a TLS server block
#   mounted into /etc/nginx/tls/ - the http-level include below loads every
#   *.conf found there, and a wildcard include that matches nothing is not an
#   error, so the shipped image starts with no certificate present.
#   docker/nginx.tls.conf.template is the ready-made block: it declares
#   `listen 443 ssl` for the deployment's own server_name - taken from the one
#   required DNN_PUBLIC_HOST setting and rendered into /etc/nginx/tls/ by this
#   image's own entrypoint - redirects that name's port 80 to it, and forwards
#   `X-Forwarded-Proto $scheme` from the listener that actually accepted the
#   request. It serves the application by INCLUDING the same three snippets this
#   server includes, so the two listeners cannot diverge. docker/docker-compose.tls.yml
#   mounts it, publishes 443, names this hop in Proxy__KnownProxies so the API
#   believes the forwarded scheme, derives the API's own AllowedHosts and
#   cross-origin allow-list from that same DNN_PUBLIC_HOST, and sets
#   Https__RedirectEnabled=true so the API enforces the transport for anything that
#   reaches it without the proxy.
#
#   No certificate, key or passphrase is committed to this repository, and none
#   may be. A `listen 443 ssl` directive whose certificate is absent makes nginx
#   fail to START, so declaring one here would fail the container build gate
#   rather than harden anything.
#
# THE EXACT PERMITTED DELTA FROM THE SUPPLIED EXAMPLE, AND THE AUTHORITY FOR IT.
# AAP 0.9.3 supplies this file's directive inventory; AAP 0.9.6 separately makes
# this file the home of the "content-security headers" non-functional
# requirement ("Angular's built-in sanitisation plus header configuration in the
# supplied proxy config"). The two are reconciled the only way they can be: every
# directive the inventory names is present and unchanged - worker_connections
# 1024, the SPA fallback, the /api/ proxy with its six forwarded headers, and the
# one-year immutable asset policy - and the delta is confined to additions that
# 0.9.6 mandates or that a Linux container demonstrably requires. The complete
# list of additions is:
#   1. Response security headers, including the content security policy required
#      by 0.9.6, and strict transport security emitted only on a request this
#      server accepted over TLS.
#   2. The http-level TLS include, so a deployment can terminate TLS in THIS
#      proxy by mounting a server block rather than by editing this file.
#   3. Two access-log formats that record only what this server itself authored,
#      each as one JSON object per line, together with an error channel raised to
#      `crit` so nginx's own non-configurable error format cannot copy a raw
#      request line into the log during ordinary upstream failure - see the note
#      above log_format for the full reasoning and for what that costs.
#   4. The events block, the mime.types include, the IPv6 listener and the
#      exact-match /nginx-health location, each of which is required for nginx to
#      start, to serve correctly, or to answer the container health probe this
#      image declares.
#   5. A LATE-RESOLVING UPSTREAM for the /api/ proxy - a resolver plus a variable
#      holding the service name - because the example's literal upstream name is
#      resolved once at configuration load. Runtime testing measured two failures
#      that follow from that one fact and from nothing else: recreating only the
#      api service left this proxy dialling a dead address PERMANENTLY and
#      SILENTLY, with both containers reporting healthy and the application
#      loading but every request failing; and this container could not start at
#      all while the api service was absent, taking the static application down
#      instead of only its API calls. The proxy is the single route from the
#      browser to the API, so neither is survivable. The block itself carries the
#      full reasoning and the measurements.
#   6. An RFC 7807 answer when the API cannot be reached, so the one failure a
#      client cannot anticipate is reported in the same problem-details contract
#      as every other, rather than as nginx's HTML error page. 0.9.6 mandates
#      that contract for this application's errors; a proxy that serves the
#      application and speaks for it when it cannot answer is not a sensible
#      exception to it.
#   7. THE INVENTORY'S DIRECTIVES LIVE IN THREE SHARED SNIPPETS RATHER THAN INLINE,
#      and this is a relocation, not a change: nginx `include` is textual, so every
#      directive the inventory names is still applied to this server, in the same
#      order, with the same values. What it buys is that the SECOND server - the
#      TLS block a public deployment mounts - applies the identical directives from
#      the identical file. It previously carried a COPY of the four-line /api/
#      proxy and of the header sets, so additions 1, 5 and 6 above reached only the
#      plain-HTTP listener while the public one silently kept the original
#      behaviour, and the copies had already drifted in their header lists. The
#      three files are /etc/nginx/snippets/{security-headers,api-proxy,spa-static}.conf,
#      copied into the image by docker/frontend.Dockerfile; each carries the full
#      reasoning for the directives it holds.
#
#   7. A CANONICALISED CORRELATION IDENTIFIER, which 0.9.6 mandates be propagated
#      end to end. One map at the top of this file reduces an inbound
#      X-Correlation-Id to the two canonical shapes the API and the browser share,
#      substituting nginx's own $request_id for anything else; that one value is
#      then forwarded to the API as a seventh proxy header, returned on the
#      gateway response, written into the gateway problem document, and recorded
#      in this server's access line. Without it the upstream-unreachable answer
#      added by item 6 - the one path on which the API's own correlation
#      middleware never runs - was unjoinable to anything, and echoing the raw
#      header instead would have carried whatever the caller chose to send,
#      including a credential, into all four of those places.
# Nothing the inventory names is removed, reordered or weakened, and no directive
# outside that list decides anything about transport. Additions 5 and 6 are the
# only ones that change what the inventory's own directives DO, and each is
# confined to the /api/ proxy: the SPA fallback, the asset policy and the worker
# and header settings are untouched. Every item above is recorded in
# MIGRATION_NOTES.md under the container-example heading.
#
# THE PLAIN-HTTP LISTENER BELOW IS NOT THE PRODUCTION POSTURE ON ITS OWN. AAP
# 0.9.4 gate 7 probes "curl -f http://localhost:4200" and the supplied
# docker-compose.yml publishes 4200:80, so an HTTP listener that redirected or
# refused would fail an acceptance criterion of this migration. A deployment that
# faces the public internet mounts the TLS block described above; the API refuses
# cleartext by default outside development and honours this proxy's
# X-Forwarded-Proto once the deployment names this hop as trusted.
#
# Deliberately absent, each for a reason:
#   - No certificate, key or TLS listener IN THIS FILE - see above.
#   - No redirect and no scheme decision of any kind. That is the fix, not an
#     omission: a redirect decided here could only be decided from caller input.
#   - No `upgrade-insecure-requests` in the content security policy. It would
#     rewrite every subresource request of a plain-HTTP document to HTTPS, which
#     on the gate's own loopback probe means rewriting them to a port nothing
#     listens on. A deployment that terminates TLS has no plain-HTTP document to
#     upgrade.
#   - No cross-origin response headers - see /etc/nginx/snippets/api-proxy.conf.
#   - No load-balancing pool and no rate limiting. Rate limiting belongs to the
#     API (Extensions/RateLimitingExtensions.cs), and the API's health endpoint is
#     anonymous and published on its own port, so it is probed directly rather
#     than through this proxy - /health is deliberately NOT proxied here.
#     A pool would imply more than one API replica, which the topology does not
#     run: the API's refresh-token store is process-local - AAP rule T4 leaves the
#     legacy schema untouched, so no table backs it - so a second replica without
#     sticky routing would reject refresh tokens issued by the first. That
#     constraint is a property of the SHIPPED store rather than of the API: a
#     deployment that registers its own IRefreshTokenStore and declares
#     RefreshTokenStore:Provider=External may pool, and the API refuses to start
#     if the declaration and the registration disagree. The API also publishes the
#     constraint as a health-check fact rather than leaving it to prose - the
#     `refresh-token-store` liveness probe reports the active store, its replica
#     safety and its utilisation - and README.md records all of it under
#     "Operating the topology". There IS a
#     per-request DNS lookup, and it is addition 5 above rather than an omission -
#     see /etc/nginx/snippets/api-proxy.conf for why the alternative was untenable.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Load-bearing. Without this include every response would be labelled with
    # the default_type below, the browser would refuse to execute the JavaScript
    # bundle, and the SPA would render a blank page - while `curl -f` still
    # reported 200. That makes omitting it invisible to the end-to-end gate,
    # which is exactly why it is never optional.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    # An exact version string in a response header is free reconnaissance for
    # anyone matching a server against known advisories.
    server_tokens      off;

    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_comp_level    6;
    # text/html is always compressed and listing it again is a duplicate-type
    # error. Already-compressed binaries are omitted on purpose: recompressing
    # them spends CPU and returns nothing.
    gzip_types         text/plain text/css text/xml text/javascript
                       application/json application/javascript
                       application/xml application/xml+rss
                       image/svg+xml;

    # ---- Access and error logging -------------------------------------------
    # NOTHING A CALLER SUPPLIES IS RETAINED HERE, AND THE ONE APPARENT EXCEPTION IS
    # NOT ONE. Every field below is authored by this server - its own clock, the
    # method it parsed, the status it answered with, the bytes it wrote, the time it
    # took, and the class of the upstream's reply - except $safe_correlation_id,
    # which is a caller value ONLY when the caller's value was already canonical
    # hexadecimal, and is otherwise this server's own $request_id. The request PATH,
    # the query string, the User-Agent, X-Forwarded-For and the RAW X-Correlation-Id
    # are all caller-controlled text, and every one of them is omitted.
    #
    # THE CLIENT ADDRESS IS OMITTED TOO, and its removal is the fix for a reported
    # defect rather than a preference. $remote_addr was recorded on EVERY access
    # record, which meant this container's logs held a continuous, per-request
    # register of who connected to the application - personal data under any reading
    # - in a store whose retention and access sit outside this application's
    # control, for no diagnostic purpose this topology needs. The API partitions its
    # credential rate limiter per caller and can attribute an abusive caller itself
    # from the forwarded address, so nothing that acts on the address loses it; what
    # is lost is only the retention.
    #
    # WHY THE REST WAS ALREADY OMITTED. An earlier format recorded the original
    # path, the raw User-Agent, the raw X-Forwarded-For and the raw
    # X-Correlation-Id. A path routinely carries an identifier that identifies a
    # person - the account endpoints are addressed by user id, and a mistyped
    # credential or a token pasted into a URL lands there too - and the three headers
    # are unbounded attacker-controlled strings that a caller can also use to forge a
    # log line. AAP 0.9.6 requires structured logging that excludes sensitive data,
    # and an access log is not exempt from that because it is conventional.
    #
    # THE FORMAT IS JSON, WITH escape=json, AND BOTH HALVES OF THAT MATTER. One
    # object per line is what a collector can parse into named fields without a
    # bespoke pattern, which is what makes these records queryable alongside the
    # API's own structured events; and escape=json is what guarantees the line stays
    # parseable whatever a field holds, so a future field cannot break every
    # downstream reader by containing a quotation mark.
    #
    # THE DIAGNOSTIC CAPABILITY IS NOT LOST, IT IS MOVED TO WHERE IT CAN BE
    # EXPRESSED SAFELY. The API records, per request, its method, the matched
    # ROUTE TEMPLATE (never the path), the status, the elapsed time and the
    # correlation identifier - see Api/Middleware/RequestLoggingMiddleware.cs and
    # CorrelationIdMiddleware.cs. A route template says which screen or endpoint was
    # addressed without carrying the values in it. This record now shares that
    # identifier, so a proxy line and the API lines for the same request join on it -
    # including on the one path where the API wrote no lines at all, because it was
    # never reached.
    #
    # THE ERROR LOG IS RAISED TO `crit`, AND THAT IS THE REMAINING FIX. nginx writes
    # the whole request line - path and query string included - into an error entry,
    # and that format cannot be configured. Raising the threshold from `warn` to
    # `error` stopped routine client-side conditions from depositing raw request
    # lines, but it left the one class that matters: an upstream failure is reported
    # at `error` level, so precisely when the API became unreachable this container
    # wrote lines like `connect() failed (111: Connection refused) while connecting
    # to upstream, request: "GET /api/v1/users/42?query=someone@example.com
    # HTTP/1.1"` - an account identifier, a search term that is routinely an email
    # address, and anything a caller mistakenly put in a URL - into a log whose
    # retention and access sit outside this application's control. The API's own
    # logger records a route TEMPLATE and never a path, so the proxy was the only
    # edge that retained caller text at all.
    #
    # `crit` is above the level upstream and TLS failures are reported at, so those
    # entries stop being written. `emerg` and `alert` are still recorded, which is
    # what keeps a configuration failure or an exhausted worker slot visible: those
    # describe THIS server rather than a request, and nginx refusing to start must
    # never be silent.
    #
    # THE DIAGNOSTIC CAPABILITY IS REPLACED, NOT DISCARDED. `gateway` below records
    # every upstream failure through the access log instead, from fields this server
    # authored, and the `@api_unavailable` location in
    # /etc/nginx/snippets/api-proxy.conf is where it is applied. The four upstream
    # fields still separate the causes a `crit` threshold hides: an empty
    # `upstream=` is a name that did not resolve, an address with an empty
    # `ustatus=` is a refused or timed-out connection, and an empty `uconnect=`
    # distinguishes "never connected" from "connected, then timed out". What is
    # deliberately absent from both formats is every byte the CALLER chose.
    #
    # WHY NOT A METRICS ENDPOINT INSTEAD. `stub_status` publishes connection and
    # request counters and says nothing about an upstream, so it would add a surface
    # without adding the signal this replaces. The gateway line is the upstream
    # signal, it is emitted exactly when a failure occurs, and it reaches the same
    # collector as every other record.
    #
    # WHAT THAT COSTS, STATED PLAINLY: the upstream address nginx tried is no longer
    # written on an unreachable-API event. What replaces it is better suited to the
    # purpose - every such request appears in the access record with
    # upstream_status_class "none", a 503 status and a correlation identifier that
    # the client's own report quotes - and the cause is diagnosed from the API's
    # health views and the compose topology rather than from a proxy log line
    # carrying a caller's URL.
    #
    # RETENTION AND ACCESS. In nginx:alpine both paths below are symlinks to the
    # container's standard output and error, so records reach `docker logs`, live
    # exactly as long as the deployment's log collector keeps them, and nothing
    # accumulates in a file inside the container.
    # ---- Request correlation, gated at the proxy -----------------------------
    #
    # ONE CANONICAL SHAPE, ENFORCED HERE AS WELL AS IN THE API. An inbound
    # X-Correlation-Id is carried forward only when it is 32 hexadecimal characters,
    # or the hyphenated 36-character 8-4-4-4-12 rendering the single-page application
    # mints - and nothing else. Anything else resolves to $request_id, nginx's own
    # per-request identifier, which is 32 hexadecimal characters and is therefore
    # already in the accepted shape. The three copies of this rule
    # (Api/Middleware/CorrelationIdMiddleware.cs,
    # frontend/src/app/core/interceptors/correlation-id.interceptor.ts and this map)
    # MUST agree; a value one layer keeps and another replaces splits one request
    # across two identifiers, which is the failure correlation exists to prevent.
    #
    # WHY THE PROXY NEEDS ITS OWN IDENTIFIER AT ALL, in two parts:
    #
    #   1. THIS SERVER ANSWERS FOR THE API WHEN THE API CANNOT BE REACHED (the
    #      @api_unavailable location in /etc/nginx/snippets/api-proxy.conf), and that
    #      is precisely the path on which the API's own correlation middleware and its
    #      log scope NEVER RUN. The document returned there carried no identifier of
    #      any kind, so the one failure a client cannot anticipate was also the one
    #      failure nobody could join to anything: no header to read, no member in the
    #      body, and nothing in this container's records either.
    #   2. AN INBOUND IDENTIFIER IS CALLER-CONTROLLED TEXT. Copying
    #      $http_x_correlation_id anywhere - into a log record, a response header
    #      or a JSON body - would deposit whatever the caller chose, which may be a
    #      password, a token, an e-mail address or an API key. That is the same
    #      finding the API and the browser were fixed for, and a proxy that echoed
    #      the raw header would have reopened it for every request.
    #
    # The resolution is to CANONICALISE rather than to echo or to ignore, which is
    # what the map below does.
    #
    # WHY THE SHAPE IS ALSO WHAT MAKES INTERPOLATION SAFE. $safe_correlation_id can
    # only ever be hexadecimal and hyphens, so it cannot carry a quotation mark, a
    # backslash, a control character or a newline. That is what allows it to be
    # written into the JSON problem document in
    # /etc/nginx/snippets/api-proxy.conf - which nginx cannot escape for us - and
    # into a response header, without either becoming an injection point. An earlier
    # revision declined to put ANY value in that body for exactly this reason, and it
    # was right about the danger and wrong about the remedy: the remedy is a value
    # that needs no escaping.
    #
    # Case-insensitive matching (~*) because hexadecimal is written in either
    # register and a caller re-sending an identifier it received is not obliged to
    # re-case it; the value is preserved as received rather than normalised, for the
    # same reason the API preserves it.
    map $http_x_correlation_id $safe_correlation_id {
        default                                                                            $request_id;
        "~*^[0-9a-f]{32}$"                                                                 $http_x_correlation_id;
        "~*^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"                 $http_x_correlation_id;
    }

    # The upstream's answer reduced to its STATUS CLASS, which is as much as a proxy
    # record needs and less than $upstream_status discloses. A class distinguishes
    # "the API refused it" from "the API failed" from "this proxy never reached the
    # API" - the three readings an operator acts on differently - while a bare
    # status invites correlating a specific code with a specific request target,
    # which this record deliberately does not carry. "none" is the honest answer for
    # a request this server served itself, such as the application document or a
    # static asset.
    map $upstream_status $upstream_status_class {
        default      "other";
        ""           "none";
        "~^2\d\d$"   "2xx";
        "~^3\d\d$"   "3xx";
        "~^4\d\d$"   "4xx";
        "~^5\d\d$"   "5xx";
    }

    # BOTH FORMATS ARE JSON AND BOTH CARRY THE CORRELATION IDENTIFIER, so one request
    # is followed from the browser's report, through this proxy, into the API's own
    # structured record. Neither carries a single byte the CALLER chose: no request
    # target, no query, no user agent, no referrer - a URL is the one field of an
    # access record that routinely contains a token, an e-mail address or an account
    # name.
    log_format  main     escape=json
                         '{"time":"$time_iso8601",'
                         '"method":"$request_method",'
                         '"status":$status,'
                         '"bytes":$body_bytes_sent,'
                         '"request_seconds":"$request_time",'
                         '"upstream_seconds":"$upstream_response_time",'
                         '"upstream_status_class":"$upstream_status_class",'
                         '"correlation_id":"$safe_correlation_id"}';
    log_format  gateway  escape=json
                         '{"time":"$time_iso8601",'
                         '"method":"$request_method",'
                         '"status":$status,'
                         '"bytes":$body_bytes_sent,'
                         '"request_seconds":"$request_time",'
                         '"gateway":"api_unreachable",'
                         '"upstream":"$upstream_addr",'
                         '"upstream_status":"$upstream_status",'
                         '"upstream_connect_seconds":"$upstream_connect_time",'
                         '"upstream_seconds":"$upstream_response_time",'
                         '"correlation_id":"$safe_correlation_id"}';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   crit;

    # A TLS server block mounted here is loaded; nothing mounted is not an error.
    # See the transport-security note in this file's header.
    include /etc/nginx/tls/*.conf;

    # ---- Transport and response policy --------------------------------------
    # Declared once, here, and consumed by variable everywhere below. Repeating a
    # policy string in each of the three header sets would let the copies drift,
    # and a drifted content security policy is worse than none: the strictest copy
    # decides, so one stale entry breaks the application on whichever path carries
    # it. A map cannot be empty by accident either - it always resolves to its
    # default - which is the property an omitted-header failure mode needs.

    # SEC-B4: THERE IS NO $edge_scheme, NO $loopback_addressed AND NO
    # $enforce_https ANY MORE. All three were removed with the redirect they
    # drove. The first read a caller-supplied header, the second read the
    # caller-supplied Host, and between them a plain-HTTP client could exempt
    # itself from the transport policy with one header of its choosing. Everything
    # below now keys on $scheme, which is the scheme of the listener that actually
    # accepted the request and is therefore the one value on this server a caller
    # cannot influence.

    # Strict transport security, and only over TLS. nginx omits an add_header whose
    # value resolves to the empty string, so the default below is what keeps the
    # header off a plain-HTTP response rather than a second conditional. A
    # deployment that terminates TLS in front of this container emits the header
    # from that hop, which is the layer that actually holds the TLS connection.
    # One year with subdomains included, and deliberately NOT `preload`: browser
    # preload lists are effectively irreversible and are not a decision a
    # container image may take on a deployment's behalf.
    map $scheme $hsts_policy {
        default   "";
        "https"   "max-age=31536000; includeSubDomains";
    }

    # The content security policy for the single-page application. Keyed on a
    # variable only because a map needs a source; the value is the same for every
    # request, which is the point - one definition, three consumers.
    #
    # Every directive here was verified against the ACTUAL production bundle this
    # image serves, not assumed:
    #   * script-src 'self' with NO 'unsafe-inline' and NO 'unsafe-eval'. The
    #     built document carries no inline script and no inline event-handler
    #     attribute, which is only true because the production build disables
    #     critical-CSS inlining (frontend/angular.json). With that optimisation on,
    #     the builder emits `<link ... media="print" onload="this.media='all'">`,
    #     an inline handler that this directive blocks - and the failure is
    #     invisible to a status-code probe, because the document still returns 200
    #     while rendering with only its inlined critical styles. Turning the
    #     optimisation off is what buys a script policy with no exception in it.
    #   * style-src 'self' 'unsafe-inline' - the one exception in this policy, and
    #     it is narrow and unavoidable. Angular injects each component's styles at
    #     run time as a `<style>` element, which CSP counts as an inline
    #     stylesheet; removing the exception would strip every component of its
    #     styling. Eliminating it needs a per-response nonce threaded into the
    #     document and the framework's nonce attribute, which requires a templated
    #     index document this image does not have. Style injection cannot execute
    #     script, so the exception does not weaken the script policy.
    #   * connect-src 'self' - the bundle is built with the RELATIVE API base
    #     /api/v1 and reaches the API through the shared proxy snippet, so every request it
    #     makes is same-origin. A deployment that moved the API to another origin
    #     would have to name it here, and having to do so is the point.
    #   * img-src 'self' data: - no stylesheet in the bundle references a URL of
    #     any kind, so this is headroom for inline SVG and generated previews
    #     rather than a current requirement; a data URL cannot execute script.
    #   * object-src 'none' and frame-src 'none' - this application embeds no
    #     plugin and no frame, and both are classic injection surfaces.
    #   * base-uri 'self' - the document declares `<base href="/">`, which the
    #     router builds every URL from; without this directive an injected `<base>`
    #     could repoint every relative request at another origin.
    #   * frame-ancestors 'self' - the modern counterpart of the frame-options
    #     header in /etc/nginx/snippets/security-headers.conf, which is kept
    #     alongside it for browsers that read only that one.
    #   * form-action 'self' - the application posts through the API rather than
    #     through form submission, so nothing legitimate is refused.
    map $scheme $content_security_policy {
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    }

    server {
        # EXPLICITLY THE DEFAULT SERVER FOR PORT 80, and the keyword is load-bearing.
        #
        # MIGRATION: without it, mounting a TLS server block by route (c) silently
        #   changed what this topology does with an unmatched host. The http-level
        #   include that loads such a block sits ABOVE this server, and nginx makes the
        #   FIRST server listening on an address the default for it - so
        #   docker/nginx.tls.conf.template's own `listen 80` redirect server, scoped to the
        #   deployment's name, became the catch-all for port 80 and answered the
        #   container's own health probe with a redirect to HTTPS. The probe is
        #   `wget --spider http://127.0.0.1:80/nginx-health`, so it followed the
        #   redirect, could not verify the deployment's certificate for 127.0.0.1, and
        #   exited non-zero: the frontend container reported UNHEALTHY for its whole
        #   life the moment TLS was activated, which is exactly the state
        #   `condition: service_healthy` holds a dependent service behind. Measured,
        #   not deduced. Naming the default here makes it independent of include order
        #   and of whatever a deployment mounts: the probe and every unmatched host
        #   land in this server, which answers them over plain HTTP, while a browser
        #   asking for the deployment's own name still matches the mounted block and
        #   is redirected to TLS by it.
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        # SEC-B4: THE SERVER-LEVEL /etc/nginx/transport-policy/ INCLUDE IS GONE.
        # It was a second, server-scoped mount point for TLS directives, it matched
        # no file in any shipped topology, and it was documented as the way to make
        # this server itself terminate TLS - a route that only made sense while this
        # file owned the transport decision. It no longer does. The one supported
        # mount point is the http-level /etc/nginx/tls/ include above, which loads a
        # COMPLETE server block; docker/nginx.tls.conf.template is that block, rendered
        # into that directory by this image's own entrypoint.

        # docker/frontend.Dockerfile copies the production build output
        # (/app/dist/dnn-migration/browser) to exactly this path.
        root         /usr/share/nginx/html;
        index        index.html;

        # SEC-B4: THERE IS NO REDIRECT HERE, AND ITS REMOVAL IS THE FIX. This server
        # used to answer a plain-HTTP request with `return 307 https://...` unless the
        # request looked local - and "looked local" was decided from the caller's own
        # Host header while "already HTTPS" was decided from the caller's own
        # X-Forwarded-Proto. Either header therefore turned the policy off for
        # whoever sent it, on a listener published to the world. A redirect this
        # server could decide correctly would need a fact this server does not have,
        # so the decision moves to the layer that does have it: the TLS server block
        # mounted at /etc/nginx/tls/ owns `listen 443 ssl` for the deployment's own
        # name - which it takes from the one required DNN_PUBLIC_HOST setting rather
        # than from a name written into a tracked file - and redirects that name's
        # port 80 to it, while the API enforces the
        # transport for anything that reaches it without passing through a proxy.
        # See the transport-policy note at the top of this file.

        # Response hardening, from the one file that declares it. Mind nginx's
        # inheritance rule: an add_header in a location REPLACES the server-level set
        # rather than adding to it, so the snippet is included again by every location
        # below that declares a Cache-Control of its own. Without that repetition the
        # HTML document - the one response where framing, MIME-sniffing and
        # content-security protection matter most - would carry none of the policy.
        # ONE definition with six include sites is what stops the copies drifting,
        # which they had: the TLS server's own set had lost `usb=()` from its
        # Permissions-Policy and three headers from its asset location.
        include /etc/nginx/snippets/security-headers.conf;

        # ---- REST API reverse proxy --------------------------------------
        # BOTH LOCATIONS COME FROM ONE SHARED FILE, AND SO DOES THE TLS SERVER'S
        # COPY. /etc/nginx/snippets/api-proxy.conf declares the API location - a REGEX
        # matching `/api/` and one optional preceding tenant segment, so a child portal
        # addressed at domain/segment reaches the API too - with the late-resolving
        # upstream, the raw request target, the import-sized body allowance, the six
        # forwarded headers and the error_page that routes an unreachable API into a
        # problem document, and `location @api_unavailable`, which answers it.
        #
        # ⚠ INCLUDE ORDER MATTERS AND IS ALREADY CORRECT: this line comes BEFORE the
        # spa-static include below, so nginx tries the API regex before the asset regex,
        # and either of them before the prefix `location /` that serves the SPA
        # fallback. Swapping the two includes would not break the API - no asset
        # pattern matches an API path - but the order is the one the snippet's own
        # reasoning cites, so it is stated here rather than left to be rediscovered. docker/nginx.tls.conf.template includes the SAME file, so
        # the public TLS listener and this one cannot serve the API differently; they
        # previously did, because the TLS block held a copy of the original
        # four-line proxy and therefore none of the protections added here.
        #
        # nginx `include` is textual, so every directive the preserved example names
        # is still applied to this server, in the same order and with the same
        # values. The snippet carries the full reasoning and the measurements for
        # each one; what belongs HERE is only the fact that the two listeners share
        # it.
        include /etc/nginx/snippets/api-proxy.conf;

        # ---- Container health probe ---------------------------------------
        # An exact-match location so the compose health check reads a fixed,
        # dependency-free answer from nginx itself rather than the SPA document
        # the shared fallback would otherwise return for any path. Its access log
        # is off: a probe every few seconds is not a request anybody audits.
        location = /nginx-health {
            access_log   off;
            default_type text/plain;
            return       200 "healthy\n";
        }

        # ---- The application itself ---------------------------------------
        # The immutable-asset policy and the single-page-application fallback, from
        # the file the TLS server includes too:
        # /etc/nginx/snippets/spa-static.conf. `root` and `index` above are what it
        # serves from; the snippet decides how. Sharing them is what keeps a deep
        # link, a hashed bundle and a missing asset behaving identically on both
        # listeners - the TLS copy of these two locations had already lost three
        # response headers.
        include /etc/nginx/snippets/spa-static.conf;
    }
}
