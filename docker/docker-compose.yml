# =============================================================================
# DnnMigration - two-container topology (AAP 0.9.3).
#
#   docker-compose build
#   docker-compose up -d
#   curl -f http://localhost:8080/health   # API  (must be ANONYMOUS)
#   curl -f http://localhost:4200          # SPA  (served by nginx)
#   docker-compose down
#
# DB_CONNECTION_STRING is interpolated from docker/.env (see .env.example).
# The frontend waits for the API healthcheck, which is why /health must not
# require authentication - otherwise the frontend service never starts.
# =============================================================================
version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: dnnmigration-api:latest
    container_name: dnnmigration-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${DB_CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-DnnMigration}
      Jwt__Audience: ${JWT_AUDIENCE:-DnnMigration}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-60}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:4200}
    # Linux Docker does not resolve host.docker.internal by default (unlike Docker
    # Desktop), and .env.example points DB_CONNECTION_STRING at that name so the
    # container can reach a SQL Server running on the host. Verified required.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - dnnmigration

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: dnnmigration-frontend:latest
    container_name: dnnmigration-frontend
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - dnnmigration

networks:
  dnnmigration:
    driver: bridge
