# =============================================================================
# TLS termination for the DnnMigration front end.
#
# WHAT THIS FILE IS. A drop-in `server` block that docker/nginx.conf loads
# through `include /etc/nginx/tls/*.conf;`. It is NOT copied into the image:
# mounting it is what activates TLS, so an image build and a plain-HTTP
# deployment are unaffected by its existence. docker/docker-compose.tls.yml
# mounts it, publishes 443 and withdraws the API's published port.
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.tls.yml \
#       --env-file docker/.env up -d
#
# WHY IT IS NOT PART OF nginx.conf. A `listen 443 ssl` whose certificate is not
# on disk makes nginx fail to start, so writing it inline would take the whole
# front end down on every deployment that has not yet obtained a certificate -
# a hardening measure that produces an outage. A wildcard include that matches
# nothing is not an error, which is what makes TLS a mount rather than an edit.
#
# WHAT IT EXPECTS. Two files, mounted read-only:
#     /etc/nginx/tls/certificates/fullchain.pem   server certificate + chain
#     /etc/nginx/tls/certificates/privkey.pem     matching private key
# and the server name below replaced with the deployment's own. Both paths are
# deliberately outside /etc/nginx/tls/*.conf's own glob so that mounting the
# certificates cannot accidentally be parsed as configuration.
#
# WHAT IT DOES TO PLAIN HTTP. The `server` block in docker/nginx.conf keeps
# listening on 80 and keeps serving, because the container health probe and any
# internal caller address it there. Browser traffic is moved to TLS by the
# redirect below, which is scoped to this deployment's own server name: a
# request whose Host does not match falls through to the default server on 80
# and is served normally, so the health probe is never redirected.
#
# WHAT IT DOES NOT DO. It does not terminate TLS for the API. The API speaks
# plain HTTP on the internal network by design (docker/api.Dockerfile sets
# ASPNETCORE_URLS=http://+:8080) and this proxy forwards X-Forwarded-Proto, which
# the API's pipeline honours only from a proxy address the deployment has named
# in Proxy:KnownProxies or Proxy:KnownNetworks.
# =============================================================================

# ---- Plain HTTP for this server name: redirect to TLS -----------------------
# Scoped by server_name, so it applies to browser traffic for this deployment
# and to nothing else. The container health probe addresses the loopback address
# and therefore matches the default server, not this one.
server {
    listen      80;
    listen      [::]:80;

    # REPLACE with the deployment's own name(s).
    server_name dnn.example.com;

    # 307, matching the default server in nginx.conf, and NOT 301 or 308.
    #
    # MIGRATION: this line read 308, on the stated ground that it preserves the method
    #   and the body so a POST arriving over plain HTTP is re-issued as a POST over TLS
    #   rather than silently downgraded to a GET. That goal is real and 307 meets it
    #   just as fully - both codes preserve both - so the cacheability argument decides
    #   it, and nginx.conf sets that argument out where it chooses 307: a permanent
    #   redirect is cached by the browser and by every intermediary on the path, so a
    #   deployment that has to answer over plain HTTP again during a certificate
    #   replacement stays unreachable for callers holding the cached answer. The two
    #   files are the SAME browser-facing edge answering the same class of request, so
    #   they must not disagree; the permanence a deployment does want is expressed by
    #   strict transport security, which carries a bounded lifetime.
    #
    #   $host rather than $http_host is kept: this server answers on the default HTTP
    #   port in the topology docker-compose.tls.yml publishes, so the two resolve
    #   identically here, and carrying an HTTP port into an HTTPS target would name a
    #   port nothing listens on.
    return 307 https://$host$request_uri;
}

# ---- TLS ---------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;

    # REPLACE with the deployment's own name(s), matching the certificate.
    server_name dnn.example.com;

    ssl_certificate     /etc/nginx/tls/certificates/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/certificates/privkey.pem;

    # TLS 1.2 is retained for client compatibility; everything below it is
    # refused. The cipher list is the modern-plus-intermediate intersection:
    # forward secrecy only, authenticated encryption only, no static RSA key
    # exchange, no CBC.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:DnnMigrationTls:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    root  /usr/share/nginx/html;
    index index.html;

    # The same header set the plain-HTTP server applies, repeated because nginx
    # scopes add_header to the block it appears in - but the VALUES come from the
    # variables nginx.conf declares, not from copies written out here.
    #
    # MIGRATION: THIS BLOCK NAMED A VARIABLE THAT DOES NOT EXIST, AND NGINX REFUSED TO
    #   START BECAUSE OF IT. It carried `$csp`, a name from a revision of nginx.conf
    #   whose policy variable is now `$content_security_policy`, so mounting this file
    #   - the one documented way to terminate TLS in this container - failed with
    #   `unknown "csp" variable` and the container restarted in a loop. It also wrote
    #   its own strict-transport-security value, `max-age=63072000` WITH `preload`,
    #   where nginx.conf resolves `$hsts_policy` to one year WITHOUT preload and says
    #   why: preload is not reversible on any useful timescale and it binds every
    #   subdomain. Both now come from the declared variables, which is the principle
    #   nginx.conf states for itself - a policy string repeated in each header set is a
    #   policy string that drifts, and this file was the proof. `$hsts_policy` is
    #   correct here without a second knob: nginx.conf keys it on `$scheme`, which is
    #   "https" in a `listen 443 ssl` server, so the header is emitted here and omitted
    #   on the plain-HTTP server below. It was keyed on an `$edge_scheme` map that read
    #   the caller's forwarded header; that map is withdrawn, because a caller could set
    #   it - and this block reports the scheme from its own listener instead.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $content_security_policy always;
    add_header Strict-Transport-Security $hsts_policy always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Identical to the plain-HTTP proxy block, including the forwarded host that
    # tenant resolution depends on. $scheme resolves to "https" here, so the API
    # observes the caller's true scheme and its own redirection guard is
    # satisfied without a second configuration knob.
    #
    # MIGRATION: the forwarded host is $http_host, not $host, matching the plain-HTTP
    #   block this one claims to be identical to. $host drops a non-default port, and
    #   the API resolves the tenant by an EXACT match of host[:port] against
    #   dbo.PortalAlias - so a deployment publishing this server on any port other than
    #   443 would have had every request attributed to no tenant, which is a 403 even
    #   for a superuser. $http_host cannot carry less information than $host.
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $content_security_policy always;
        add_header Strict-Transport-Security $hsts_policy always;
        access_log off;
    }

    location / {
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $content_security_policy always;
        add_header Strict-Transport-Security $hsts_policy always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
