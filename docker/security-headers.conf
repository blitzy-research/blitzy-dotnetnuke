# =============================================================================
# docker/security-headers.conf - THE response-header policy, declared once.
#
# WHAT IT IS. A snippet, not a server block. docker/frontend.Dockerfile copies it
# to /etc/nginx/snippets/security-headers.conf - a directory nothing in the image
# auto-includes - and every context that needs the policy pulls it in with
#
#     include /etc/nginx/snippets/security-headers.conf;
#
# It is included by the server block in docker/nginx.conf, by the TLS server block
# in docker/nginx.tls.conf.template, and by every location in
# docker/api-proxy.conf and docker/spa-static.conf that declares an add_header of
# its own. THIS FILE IS MANDATORY: nginx fails to start if an include names a file
# that is not there, so removing it from either Dockerfile breaks the image build's
# own health probe rather than quietly dropping a header.
#
# WHY IT IS A SNIPPET AND NOT NINE LINES REPEATED NINE TIMES. Two nginx rules
# combine to force the repetition this file absorbs:
#   1. add_header is inherited from the enclosing block ONLY while the inner block
#      declares no add_header of its own. A location that sets Cache-Control
#      REPLACES the whole inherited set, so the HTML document - the response where
#      framing, MIME-sniffing and content-security protection matter most - would
#      carry no policy at all unless the set is restated there.
#   2. A server block inherits from http but NOT from a sibling server, so the TLS
#      server must restate everything the plain-HTTP server states.
# Before this snippet existed, that meant five copies in docker/nginx.conf and
# four more in the TLS block, and the copies HAD DRIFTED: the TLS block's
# Permissions-Policy omitted `usb=()` and listed the remaining features in a
# different order, and its immutable-asset location omitted
# Cross-Origin-Opener-Policy, X-Permitted-Cross-Domain-Policies and
# Permissions-Policy entirely. Nothing reported it, because every copy was
# individually valid. One file with nine consumers cannot drift.
#
# `always` ON EVERY LINE, AND IT IS LOAD-BEARING. Without it nginx emits an
# add_header only on 2xx, 204, 301, 302, 303, 304, 307 and 308 - so a 401 from the
# API proxy, a 404 for a missing asset and the 503 the gateway synthesises would
# all travel with no policy. An error response is exactly where an injected
# document would be most useful to an attacker.
#
# THE TWO POLICY VALUES COME FROM VARIABLES, NOT FROM LITERALS. $content_security_policy
# and $hsts_policy are declared once in docker/nginx.conf's http block and are
# therefore shared by every server, including a mounted TLS one. $hsts_policy is
# keyed on $scheme and resolves to the empty string on plain HTTP; nginx omits an
# add_header whose value is empty, so strict transport security appears on a TLS
# response and is absent from a cleartext one with no second conditional anywhere.
#
# WHAT IS DELIBERATELY NOT HERE
#   - No Access-Control-* header. The production bundle calls the API through this
#     same origin (frontend/src/environments/environment.ts sets the RELATIVE
#     /api/v1), so there is no cross-origin request for this hop to authorise; the
#     policy that does exist is configured API-side in
#     Api/Extensions/CorsExtensions.cs as a named allow-list.
#   - No Cache-Control. It differs per response class - immutable for hashed
#     assets, no-store for the document and for the gateway's error - so it stays
#     with the location that decides it.
# =============================================================================

# Refuse the browser's MIME-sniffing, so a response labelled text/plain can never
# be executed as script because its bytes happened to look like one.
add_header X-Content-Type-Options "nosniff" always;

# Framing, for browsers that read only this header. Its modern counterpart is the
# frame-ancestors directive inside the content security policy below.
add_header X-Frame-Options "SAMEORIGIN" always;

# Send the full referrer within this origin and only the origin across one, so an
# outbound link cannot leak a path that identifies a tenant, a page or an account.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The content security policy for the single-page application. Declared as a map
# in docker/nginx.conf, where each directive is argued against the ACTUAL
# production bundle this image serves.
add_header Content-Security-Policy $content_security_policy always;

# Emitted only on a request this server accepted over TLS - see the note above.
add_header Strict-Transport-Security $hsts_policy always;

# Sever this document's browsing context from any cross-origin opener, so a window
# that opened the application cannot reach into it.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Refuse the legacy plugin cross-domain policy files outright; this application
# serves none and an attacker-supplied one would widen access.
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Withdraw the powerful features this administration console never uses. An
# administration console has no legitimate need for a camera, a microphone, a
# location, a payment handler or a USB device, and withdrawing them here means a
# script that somehow ran could not ask for them either.
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
