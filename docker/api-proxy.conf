# =============================================================================
# docker/api-proxy.conf - THE reverse-proxy contract between the browser and the
# API, declared once and served identically over plain HTTP and over TLS.
#
# WHAT IT IS. A snippet holding two locations, valid in a `server` context.
# docker/frontend.Dockerfile copies it to /etc/nginx/snippets/api-proxy.conf and
# every server block that serves this application pulls it in with
#
#     include /etc/nginx/snippets/api-proxy.conf;
#
# Its consumers are the plain-HTTP server in docker/nginx.conf and the TLS server
# in docker/nginx.tls.conf.template. THIS FILE IS MANDATORY: an include naming a
# file that is not present makes nginx fail to START, so the image's own health
# probe fails immediately rather than the proxy quietly losing a directive.
#
# WHY IT IS SHARED RATHER THAN COPIED, WHICH IS THE CORRECTION THIS FILE EXISTS
# TO MAKE. Every protection below was added to the plain-HTTP server after runtime
# testing measured the failure it prevents - and the TLS server, the one a public
# deployment actually serves from, kept a COPY of the original four-line proxy
# block and therefore had none of them. In the public topology that meant: an
# API-only redeploy could leave nginx dialling a dead address permanently and
# silently; a module import above nginx's 1 MiB default was refused by a hop whose
# limit the API's contract does not describe; an encoded path segment was decoded
# by this hop and re-read differently by the next; and an unreachable API answered
# with nginx's HTML error page instead of the problem document the client parses.
# A copy that has to be kept in step with another copy is a defect waiting for the
# next edit, so there is now exactly one copy and both servers include it.
#
# WHAT IT DEPENDS ON FROM THE INCLUDING CONFIGURATION
#   * the `api` service name, resolvable on the compose network (docker-compose.yml);
#   * $content_security_policy and $hsts_policy, declared in docker/nginx.conf's
#     http block and consumed through /etc/nginx/snippets/security-headers.conf;
#   * `log_format gateway`, also declared in docker/nginx.conf's http block,
#     because log_format is only valid there. A server that includes this snippet
#     without that format would fail to start with an unknown-format error, which
#     is the correct way for that mistake to surface.
#
# WHAT IS DELIBERATELY ABSENT
#   * No cross-origin response header: the production bundle uses the RELATIVE base
#     /api/v1, so every call is same-origin and there is nothing to authorise here.
#     The API's own named policy lives in Api/Extensions/CorsExtensions.cs.
#   * No /health proxy. The API's health views are anonymous on the API's OWN
#     published port, and both the compose dependency condition and the migration
#     plan's end-to-end gate probe them there. Proxying them would widen this
#     surface for no caller.
#   * No load-balancing pool. The API's refresh-token store is process-local by
#     design - AAP rule T4 leaves the legacy schema untouched, so no table backs it
#     - so a second replica without sticky routing would reject refresh tokens
#     issued by the first. The constraint belongs to the SHIPPED store, not to the
#     API: a deployment registering its own IRefreshTokenStore and declaring
#     RefreshTokenStore:Provider=External may pool, and the API refuses to start if
#     that declaration is not matched by a registration. README.md and
#     MIGRATION_NOTES.md state all of it, and the API publishes the running answer
#     as a health-check fact rather than as prose: the `refresh-token-store`
#     liveness probe names the active store, its replica safety and its usage.
#   * No rate limiting. It belongs to the API, which partitions the credential
#     budget per caller from the forwarded address this file supplies
#     (Api/Extensions/RateLimitingExtensions.cs).
# =============================================================================

# ---- REST API reverse proxy -------------------------------------------------
# `api` is the SERVICE NAME declared in docker/docker-compose.yml, resolved by
# Docker's embedded DNS on the compose network. It is not a name of this
# container.
#
# This block is the ONLY path from the single-page application to the API, because
# the production bundle sets apiBaseUrl to the RELATIVE '/api/v1'
# (frontend/src/environments/environment.ts) so the browser addresses only the
# origin that served it. An absolute base URL would resolve solely inside the
# Docker network and fail from the browser - both containers healthy, application
# entirely non-functional, and no build step the wiser.
#
# The location prefix and the forwarded path are IDENTICAL - /api/ maps to /api/ -
# which is what makes the request-URI form below correct: there is no prefix to
# rewrite, so forwarding the caller's own request target reproduces the mapping
# exactly.
#
# LOCATIONS ARE CASE-SENSITIVE, AND ONLY /api/ IS PROXIED. A request for
# /API/v1/... does not match this prefix and falls through to the SPA document.
# That is deliberate: the production bundle emits only lower-case /api/v1 paths
# from a constant rather than from caller input, so widening the surface would
# proxy requests the application never makes.
location /api/ {
    # THE UPSTREAM IS RESOLVED PER REQUEST, NOT ONCE AT CONFIGURATION LOAD.
    # `proxy_pass http://api:8080/api/;` - a literal name with no variable - is
    # resolved ONCE while nginx parses the configuration and then cached for the
    # life of the process. Two failures follow from that single fact, and both were
    # measured rather than deduced:
    #
    #   1. A stale address after an API-only redeploy. Recreating just the api
    #      service - `docker compose up -d --force-recreate api`, the ordinary way
    #      to roll out a new image - can place the container on a different address
    #      on the compose network, and compose does not recreate this container with
    #      it. nginx went on dialling the address it had resolved at ITS start: the
    #      first call hung for the full proxy timeout and every later one was
    #      refused, with `connect() failed (111: Connection refused) while
    #      connecting to upstream` and NO self-healing at +10, +20, +30, +40, +50 or
    #      +60 seconds. Throughout, `docker compose ps` reported BOTH services
    #      `Up (healthy)` and this server still returned the SPA document with 200 -
    #      so a user loaded the application and every request it made failed, while
    #      neither the health checks nor the dependency condition revealed anything.
    #      That is the worst shape a fault can take, and this proxy is the single
    #      route from the browser to the API, so surviving an API redeploy is a
    #      requirement of the topology rather than a nicety.
    #
    #   2. The container could not START while the api service was absent. An
    #      unresolvable literal upstream is a CONFIGURATION error, not a runtime
    #      one: nginx exited with `[emerg] host not found in upstream "api"` and
    #      Docker restarted it in a loop, so stopping the api service took the
    #      entire static single-page application down with it - :4200 unreachable -
    #      rather than degrading only the API calls.
    #
    # A name held in a VARIABLE is resolved when the request is served, so both
    # failures disappear together. The cost is that nginx then needs a resolver of
    # its own, which is what the two directives below supply.
    #
    # 127.0.0.11 is Docker's embedded DNS server, present on every user-defined
    # network - which docker-compose.yml declares - and it is the only name service
    # that knows this compose project's service names. `valid=10s` overrides the
    # long time-to-live Docker publishes and is what bounds staleness: a
    # re-addressed API is picked up within ten seconds, measured as 502 at +5s and
    # +10s and 200 at +15s and +20s after a deliberate address change, with no
    # restart of anything. `ipv6=off` stops nginx pairing every lookup with an AAAA
    # query this network does not answer, which would add a resolver timeout to
    # each request. `resolver_timeout` is stated because the default is thirty
    # seconds: a deployment running this image OUTSIDE a user-defined network has no
    # 127.0.0.11 to ask, and it must fail fast into the problem-details answer below
    # rather than hold a browser connection open for half a minute.
    resolver           127.0.0.11 valid=10s ipv6=off;
    resolver_timeout   5s;
    set                $api_upstream api;

    # $request_uri IS THE CALLER'S OWN REQUEST TARGET, PATH AND QUERY TOGETHER, AND
    # PASSING IT UNCHANGED IS BOTH REQUIRED AND SAFER.
    #
    # Required: once a variable appears in proxy_pass, nginx can no longer work out
    # which part of the URI to replace, so whatever URI the directive names is sent
    # AS IS. Writing `/api/` here would forward every request in the application to
    # the single path /api/. The request target has to be named explicitly, and
    # naming it is not a rewrite - the location prefix and the upstream prefix are
    # the same string, so this reproduces the literal form's mapping exactly.
    # Verified against a request-echoing upstream: /api/v1/portals,
    # /api/v1/portals/-1, a trailing slash and a query string all arrive
    # byte-identical to what the browser sent.
    #
    # Safer: the literal form sent nginx's NORMALISED, DECODED uri, which turned
    # %2F inside a path segment into a real path separator upstream -
    # /api/v1/na%2Fme arrived as /api/v1/na/me. The API's routing and its
    # authorisation both key on path segments, so a caller could compose a target
    # that this hop and the next disagreed about. The raw request target cannot be
    # misread that way, because it is never decoded here. The one visible
    # consequence is that a caller-authored double slash is no longer silently
    # collapsed: /api//v1/portals now reaches the API as written and is answered 404
    # with a problem document instead of matching a route. Nothing the application
    # emits contains one.
    proxy_pass         http://$api_upstream:8080$request_uri;
    proxy_http_version 1.1;

    # A FAILURE TO REACH THE API IS ANSWERED IN THE CONTRACT THE CLIENT PARSES.
    # Without this, nginx answers its own HTML error page: the single-page
    # application's error interceptor reads RFC 7807 problem documents
    # (core/interceptors/error.interceptor.ts) and has to synthesise a generic
    # sentence for a body it cannot parse, so the one failure an operator most needs
    # described - "the API is not there" - is the one presented worst.
    #
    # The `=` form is load-bearing. Without it the status line would keep nginx's
    # own 502 or 504 while the body below declared 503, and a problem document whose
    # status disagrees with its response is worse than no document at all.
    error_page 502 503 504 = @api_unavailable;

    # THE OUTERMOST LIMIT OF THE TRANSFER PATH, AND STATING IT IS THE FIX. nginx
    # defaults client_max_body_size to 1m, so leaving it unstated makes THIS the
    # binding limit for every API request - including the one endpoint the API
    # deliberately allows more for. A body nginx refuses never reaches the API at
    # all, so the caller receives a 413 from a hop whose limit the API's own
    # contract does not describe, and the module import the service was sized to
    # accept cannot be delivered.
    #
    # The value is the EXACT byte count of
    # ServiceCollectionExtensions.MaximumImportRequestBodyBytes (6 356 992 =
    # 1 048 576 document characters x 6 worst-case JSON bytes each + 64 KiB of
    # envelope headroom), written out rather than rounded to a megabyte suffix so
    # the two layers carry one number that can be compared by eye. The API keeps its
    # own global limit at one mebibyte and raises it per action, so this allowance
    # is only reachable on the import action - which requires a tenant administrator
    # - while every other endpoint is still refused at a mebibyte by the layer
    # behind this one. Raise this and the endpoint that needs it stops working;
    # lower the document ceiling and this comes down with it.
    client_max_body_size 6356992;

    # Upgrade and Connection are meaningful only over HTTP/1.1, which the line above
    # selects; nginx proxies with HTTP/1.0 by default and that version cannot
    # negotiate a connection upgrade.
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";

    # $http_host - the Host header EXACTLY as the browser sent it, including the
    # port - rather than nginx's default $proxy_host or the port-stripped $host. The
    # API resolves the tenant by exact-matching host[:port] against
    # dbo.PortalAlias, so three things are true at once: the upstream's own name
    # owns no alias row and identifies no tenant; $host would silently drop the
    # port, so an alias configured as admin.example.com:4200 would arrive as
    # admin.example.com and fail to resolve; and only the unmodified header matches
    # an alias for every port a deployment may publish. Verified by experiment
    # rather than assumed: authenticating with the forwarded browser host resolves
    # the portal and returns 200, while the same request carrying the upstream's own
    # name as Host is refused with 400. This one line is what makes tenancy work
    # through the proxy.
    #
    # It is also why the API refuses a FORWARDED host header while accepting a
    # forwarded address and scheme: the Host it receives here selects a tenant, so
    # it must be set by this proxy and never by a caller.
    proxy_set_header   Host              $http_host;

    # The caller's address and the scheme THIS SERVER ACCEPTED. Both are consumed
    # upstream: the API's forwarded-header stage reads them to partition its
    # credential rate limiter per caller rather than per proxy, to attribute a
    # request to its real source, and to decide whether the exchange reached the
    # edge over TLS. Which hops it believes is configured there
    # (Proxy:KnownProxies / Proxy:KnownNetworks) and, with neither set, it leaves
    # both headers as untrusted text - so this side sends them unconditionally and
    # the trust decision lives entirely with the deployment.
    # docker-compose.tls.yml is the topology that grants it.
    #
    # $scheme, NOT A FORWARDED VALUE. An earlier revision sent a value mapped from
    # the caller's own X-Forwarded-Proto, so a client that sent
    # `X-Forwarded-Proto: https` had it copied straight back out to the API, and the
    # API - having been told to trust this hop - believed it. $scheme is the scheme
    # of the listener that accepted the request: http in the base topology, https in
    # the TLS server that includes this same file. The value the API receives is
    # always authored by an nginx listener and never by a client.
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # THE CANONICALISED CORRELATION IDENTIFIER, NOT THE RAW HEADER, AND THIS LINE IS
    # WHAT MAKES THE PROXY RECORD AND THE API RECORD JOINABLE. $safe_correlation_id is
    # declared once in nginx.conf, so both servers that include this snippet forward
    # the same value. Without it the API would see whatever the caller sent and apply
    # its own validation to it while this server's access record carried the
    # canonicalised value - so a request whose inbound header was non-canonical would
    # appear under one identifier here and a different one there, which is worse than
    # having none because it looks joinable and is not. Setting it explicitly also
    # removes an ambiguity: nginx forwards unlisted client headers as they arrived, so
    # leaving this unstated meant the raw value went upstream.
    #
    # This is the seventh forwarded header, alongside the six the supplied example
    # declares. It is an ADDITION and nothing the inventory names is changed: AAP
    # 0.9.6 requires correlation identifiers to be propagated, and a proxy between the
    # browser and the API is where that requirement is either met or lost.
    proxy_set_header   X-Correlation-Id  $safe_correlation_id;
}

# ---- The API is unreachable from this proxy ---------------------------------
# Reached only from the error_page above, i.e. when THIS server could not obtain a
# response from the API: the name did not resolve, the connection was refused, or
# the upstream did not answer in time. It is never reached for a response the API
# itself produced - proxy_intercept_errors is left at its default of off, so the
# API's own 502, 503 or 504 travels to the caller untouched, including the readiness
# view's 503 when the database is down. That distinction matters: this document says
# "the API is not reachable", which would be a lie if the API had answered.
#
# 503 rather than 502, deliberately. A caller cannot act on the difference between a
# refused connection and an unresolvable name, and both are temporary by nature; 503
# with Retry-After says exactly that in the vocabulary the client already handles,
# and it matches the status the API itself uses when a dependency of its own is
# unavailable.
#
# NOTHING THE CALLER SENT APPEARS IN THIS BODY. No correlation identifier is echoed
# and no path is quoted, for two reasons: this configuration reflects no
# caller-controlled text anywhere, and a value interpolated into a JSON document
# would need JSON escaping that nginx cannot perform, so echoing a header here would
# be an injection vector in a response the caller could then quote as ours. The
# client synthesises its own reference when a document carries none.
location @api_unavailable {
    default_type application/problem+json;
    add_header   Retry-After "5" always;
    add_header   Cache-Control "no-store" always;
    # The same identifier this server logged for the request and forwarded upstream, so
    # a client reading the header, the body or the proxy record reads one value.
    add_header   X-Correlation-Id $safe_correlation_id always;

    # The response policy. Included rather than restated because nginx REPLACES an
    # inherited add_header set in any block that declares one of its own, and this
    # block declares two - so without this line the gateway's own error would be the
    # single response in the topology carrying no policy at all.
    include /etc/nginx/snippets/security-headers.conf;

    # THE GATEWAY SIGNAL, AND WHY IT IS AN ACCESS-LOG LINE RATHER THAN AN ERROR
    # ENTRY. nginx writes the whole request line, query string included, into an
    # error-log entry for every upstream failure, and that format cannot be changed
    # - so an outage was the one condition under which raw API paths, and any
    # identifier or mistakenly URL-carried secret inside one, were deposited in this
    # container's logs. docker/nginx.conf therefore raises the error log to `crit`,
    # above the level upstream failures are reported at, and this line replaces the
    # capability it withdraws with a record that carries no caller-supplied text at
    # all.
    #
    # `gateway` is declared in docker/nginx.conf's http block and records only
    # fields THIS server authored: the peer address, its own clock, the method, the
    # status, the bytes written, the elapsed time, and the four upstream fields
    # below. The cause survives in them without a path being written anywhere:
    #     upstream="-"                                the name did not resolve
    #     upstream="172.28.0.n:8080" ustatus="-"      the address refused or timed out
    #     uconnect="-"                                no connection was established
    #     uconnect="0.001" uresponse="5.000"          connected, then timed out
    # An operator who needs the request target for a single incident has it in the
    # client's own correlated record and in the API's structured log, both of which
    # carry a route template rather than a path.
    access_log   /var/log/nginx/access.log gateway;

    return       503 '{"type":"urn:dnnmigration:error:gateway.api_unreachable","title":"Service Unavailable","status":503,"detail":"The API could not be reached from the proxy that serves this application. This is a temporary deployment condition rather than a problem with the request; retry shortly.","correlationId":"$safe_correlation_id"}';
}
