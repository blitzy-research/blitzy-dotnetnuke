# =============================================================================
# docker/spa-static.conf - how the single-page application itself is served,
# declared once and served identically over plain HTTP and over TLS.
#
# WHAT IT IS. A snippet holding the two locations that serve the built Angular
# bundle, valid in a `server` context. docker/frontend.Dockerfile copies it to
# /etc/nginx/snippets/spa-static.conf and every server block that serves this
# application pulls it in with
#
#     include /etc/nginx/snippets/spa-static.conf;
#
# Its consumers are the plain-HTTP server in docker/nginx.conf and the TLS server
# in docker/nginx.tls.conf.template. Each of those still declares its own `root`
# and `index`, because those are server-level facts; everything about HOW the
# bundle is served is here.
#
# WHY IT IS SHARED. An nginx server block inherits from http but NOT from a sibling
# server, so the TLS server has to restate every location the plain-HTTP server
# declares. Two servers that must serve one application identically read from one
# file, so that "identical" is a property of the configuration rather than a claim in
# a comment.
#
# WHAT IT DEPENDS ON FROM THE INCLUDING SERVER
#   * `root` and `index`, which name where docker/frontend.Dockerfile placed the
#     production build output (/usr/share/nginx/html);
#   * /etc/nginx/snippets/security-headers.conf, which both locations include
#     because both declare a Cache-Control of their own and nginx REPLACES an
#     inherited add_header set in any block that declares one.
# =============================================================================

# ---- The API's health paths, refused here ------------------------------------
# THE FRONT END DOES NOT ANSWER THE API'S HEALTH VIEWS, AND SAYING SO OUT LOUD IS
# THE POINT OF THIS BLOCK. Only /api/ is proxied, so /health, /health/ready and
# /health/live are not API addresses on this origin - and without this location the
# SPA fallback below answered them with the application document and HTTP 200. A
# probe pointed at the front end's /health by mistake therefore reported the
# deployment healthy unconditionally: it would have kept reporting healthy with the
# API container stopped, with the database unreachable, and with every request
# failing, because the only thing it was really measuring was that nginx can serve
# a file. Measured, not deduced - `GET :4200/health` returned 200 text/html, byte
# for byte the same document as `/`.
#
# 404 rather than a redirect to the API, deliberately. A redirect would make the
# wrong probe work, which is how it would stay wrong; a hard refusal makes the
# operator look and find the two addresses that answer honestly: the API's own
# /health, /health/ready and /health/live on the API's port, and /nginx-health on
# THIS origin for this container.
#
# The regex covers the three health views and anything beneath them while matching
# /nginx-health for nobody: it is anchored, and the exact-match /nginx-health
# location in the including server takes precedence over every regex regardless of
# order. No add_header appears here on purpose, so the response inherits the
# server-level security header set; the access log is left ON, because a request to
# this address is a misconfiguration worth seeing.
#
# ANCHORED AT THE ORIGIN ROOT, AND ONLY THERE, FOR TWO REASONS. A load balancer
# probes an origin, so `/health` is the address a mistaken probe actually carries -
# and it is safe to refuse because `health` is a reserved path segment in
# DnnMigration.Domain.Common.PortalAliasTopology, so no stored alias and no
# application route can ever live there and nothing legitimate is shadowed.
# Anything deeper - /acme/health beneath a tenant segment, or a /healthz spelling
# this deployment publishes nowhere - is a browser navigation rather than a probe,
# so it is deliberately left to fall through to the SPA and be answered by the
# application's own not-found view, which is the better answer for a human.
location ~ ^/health(?:$|/) {
    return 404;
}

# ---- Immutable static assets ------------------------------------------------
# A year is safe because frontend/angular.json sets outputHashing to "all", so
# every bundle filename embeds a content hash and a new build produces new
# filenames - a stale hit is impossible by construction. index.html is deliberately
# NOT in this list: it is the one file that must always be revalidated, because it
# is what tells the browser the new hashed names.
#
# No try_files and no fallback here. A missing asset must return a genuine 404,
# never an HTML document dressed up as a script.
#
# THE TWO CACHE DIRECTIVES EMIT TWO SEPARATE Cache-Control LINES, AND THEY ARE LEFT
# AS THE SUPPLIED EXAMPLE WROTE THEM. `expires 1y` contributes `max-age=31536000`
# (and an Expires date for the HTTP/1.0 readers that still ask for one) while the
# add_header contributes `public, immutable`; a client joins repeated field lines
# with commas, so the effective policy is `max-age=31536000, public, immutable` -
# measured in a browser, which reports exactly that. Collapsing them into one
# literal header would read more tidily and would mean editing a directive pair the
# migration plan preserves verbatim, for no behavioural gain.
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
    expires    1y;
    add_header Cache-Control "public, immutable";
    include    /etc/nginx/snippets/security-headers.conf;

    # A hashed asset is fetched once per deployment per browser and says nothing an
    # audit needs; the document request that referenced it is already logged.
    access_log off;
}

# ---- SPA fallback -----------------------------------------------------------
# The application routes its paths client-side, so a refresh or a deep link on,
# say, /users/42/profile asks nginx for something that does not exist on disk.
# Serving index.html hands the path to the Angular router instead of returning 404
# on every deep link.
location / {
    try_files  $uri $uri/ /index.html;

    # index.html must never be cached: it is the document that points the browser at
    # the current hashed bundles.
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    include    /etc/nginx/snippets/security-headers.conf;
}
