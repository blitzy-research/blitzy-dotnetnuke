<!--
  THE ROUTED OWNER OF THE PROFILE-PROPERTY CATALOGUE.

  This template is intentionally the whole of the container's markup: a failure
  surface and the presentational screen, wired to the account store by the paired
  class. It declares no heading, no table and no form, because the child owns all of
  them - a second heading here would render two `h1` elements on one page.

  Every bindable name below is declared by the paired class and nothing else. The
  workspace compiles templates with strict checking, so a reference to a member the
  class does not declare is a build failure rather than a blank on the screen.
-->

<!--
  The failure document, rendered ABOVE the screen rather than inside it.

  The child takes no failure input by design - it reports what it is given and asks
  for what it wants, and rendering a transport failure is neither. Placing the banner
  here keeps the message in the reading order a screen reader follows, immediately
  before the content the failed command was acting on, and the banner carries its own
  live region so a failure arriving after the page has settled is announced.

  It renders nothing at all when there is no failure, so no empty region is
  introduced into the layout.
-->
<app-error-banner [problem]="problem()" />

<!--
  The catalogue screen.

  All five outputs are listened to. That completeness is the point of the container:
  an unlistened output is an affordance that looks like a working control and does
  nothing, and the child emits every one of these from a control an operator can see.

  The heading is deliberately NOT bound. The child's `heading` input defaults to the
  legacy caption for this screen, and supplying the same words from here would give
  the one title two origins free to disagree.
-->
<app-profile-definition-list
  [definitions]="definitions()"
  [loading]="loading()"
  [saving]="saving()"
  (create)="onCreate($event)"
  (update)="onUpdate($event)"
  (remove)="onRemove($event)"
  (reorder)="onReorder($event)"
  (bulkFlag)="onBulkFlag($event)"
/>
