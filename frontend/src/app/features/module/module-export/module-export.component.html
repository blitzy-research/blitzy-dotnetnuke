<!--
  THE LAYOUT TABLE IS GONE. `export.ascx:L4` opened a fixed-width `table` used purely for positioning,
  carrying a summary attribute that described a completely different screen - "Edit Links Design Table"
  - because the markup was copied from one.
-->
<section class="module-export">
  <!-- The page's single `h1` and its supporting sentence, both already resolved. -->
  <app-page-header [title]="title" [subtitle]="subtitle" />

  <!-- Progress. -->
  @if (moduleLoading()) {
    <app-loading-spinner size="small" [label]="loadingModuleLabel" />
  } @else if (exporting()) {
    <app-loading-spinner size="small" [label]="exportingLabel" />
  }

  <!--
    Structured refusals from the API, including the one whose sentence this screen supplies - the
    component substitutes that sentence into the document rather than rendering it separately, so the
    severity treatment, the problem title and the support reference all survive.
  -->
  <app-error-banner [problem]="problem()" />

  <!--
    ⚠ TWO CHANNELS, WHERE THERE USED TO BE ONE. Every sentence this screen raises went through the polite
    region below, so "nothing was exported" and "the export produced an empty document" were announced
    identically and neither interrupted - while a server refusal of the same action went to the assertive
    banner above. An operator who pressed Export and was told, politely and without interruption, that it
    had been refused could go on waiting for a download that was never coming.

    A REFUSAL - the action did not happen - is now assertive, matching the banner and the sibling import
    screen. Rendered conditionally on purpose: `role="alert"` announces on insertion, which is the instant
    this becomes true.
  -->
  @if (refusalNotice(); as message) {
    <p class="module-export__notice-refusal" role="alert" aria-live="assertive">{{ message }}</p>
  }

  <!--
    AN OUTCOME - the action ran, and this is what it produced - stays polite. An export that found nothing
    to write is a real answer the legacy screen also reported, not a fault, and interrupting for it would
    make an ordinary result read as one.
  -->
  @if (outcomeNotice(); as message) {
    <p class="module-export__notice-outcome" role="status">{{ message }}</p>
  }

  <!--
    ⚠ THE RECOVERY THIS SCREEN DID NOT HAVE, and the sibling import screen already did. A refused module
    read left the filename unprepopulated and the confirming action disabled; a refused export left the
    banner reporting a failure with nothing able to re-attempt it. On both paths the only way forward was
    to navigate away and come back. Offered only while a failure is actually being presented, so the
    healthy screen gains no control, and resolved to whichever operation failed rather than to one
    hard-coded command.
  -->
  @if (retryableOperation() !== null) {
    <p class="module-export__recovery">
      <button class="module-export__retry" type="button" (click)="onRetry()">Try again</button>
    </p>
  }

  <!--
    `novalidate` suppresses the browser's own validation bubbles so that the shared form field is the
    single place a message about this field appears.
  -->
  <form class="module-export__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <!--
      The filename field. The shared component owns the label, the label association, the help
      disclosure and the message region entirely - including the help affordance, which it makes
      keyboard-reachable and properly named, reversing three defects in the legacy label control.
    -->
    <app-form-field
      [label]="fileLabel"
      [for]="fileControlId"
      [required]="true"
      [help]="fileHelp"
      [error]="fileNameError"
    >
      <!--
        `maxlength` reproduces the attribute the legacy input carried, so the browser refuses the
        two-hundred-and-first character exactly as it did before. The validator behind it is the second
        line of defence for a value that arrives by some other route.
      -->
      <input
        [id]="fileControlId"
        type="text"
        formControlName="fileName"
        [maxlength]="fileNameMaxLength"
        autocomplete="off"
        spellcheck="false"
        aria-required="true"
        [attr.aria-invalid]="
          (form.controls.fileName.touched || form.controls.fileName.dirty) &&
          form.controls.fileName.invalid
        "
      />
    </app-form-field>

    <div class="module-export__actions">
      <!--
        BOTH ACTIONS ARE REAL BUTTONS. `export.ascx:L15-L16` declared them as link buttons, which render
        as anchors - elements that navigate rather than act, are announced as links, and are not
        activated by the space key.
      -->
      <button class="form-action--primary" type="submit" [disabled]="exporting() || !hasModuleToExport"
          [attr.aria-busy]="exporting() ? 'true' : null">{{ exportLabel }}</button>

      <!-- `type="button"` is the faithful translation of `causesvalidation="False"` on `export.ascx:L16`. -->
      <button type="button" (click)="cancel()">{{ cancelLabel }}</button>
    </div>
  </form>
</section>
