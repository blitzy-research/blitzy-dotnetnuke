<!--
  THE LAYOUT TABLE IS GONE. `export.ascx:L4` opened a fixed-width `table` used purely for positioning,
  carrying a summary attribute that described a completely different screen - "Edit Links Design Table"
  - because the markup was copied from one.
-->
<section class="module-export">
  <!-- The page's single `h1` and its supporting sentence, both already resolved. -->
  <app-page-header [title]="title" [subtitle]="subtitle" />

  <!-- Progress. -->
  @if (moduleLoading()) {
    <app-loading-spinner size="small" [label]="loadingModuleLabel" />
  } @else if (exporting()) {
    <app-loading-spinner size="small" [label]="exportingLabel" />
  }

  <!--
    Structured refusals from the API, including the one whose sentence this screen supplies - the
    component substitutes that sentence into the document rather than rendering it separately, so the
    severity treatment, the problem title and the support reference all survive.
  -->
  <app-error-banner [problem]="problem()" />

  <!--
    `role="status"` makes this a polite live region, so the sentence is announced without interrupting
    and without moving focus.
  -->
  @if (notice(); as message) {
    <p role="status">{{ message }}</p>
  }

  <!--
    `novalidate` suppresses the browser's own validation bubbles so that the shared form field is the
    single place a message about this field appears.
  -->
  <form class="module-export__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <!--
      The filename field. The shared component owns the label, the label association, the help
      disclosure and the message region entirely - including the help affordance, which it makes
      keyboard-reachable and properly named, reversing three defects in the legacy label control.
    -->
    <app-form-field
      [label]="fileLabel"
      [for]="fileControlId"
      [required]="true"
      [help]="fileHelp"
      [error]="fileNameError"
    >
      <!--
        `maxlength` reproduces the attribute the legacy input carried, so the browser refuses the
        two-hundred-and-first character exactly as it did before. The validator behind it is the second
        line of defence for a value that arrives by some other route.
      -->
      <input
        [id]="fileControlId"
        type="text"
        formControlName="fileName"
        [maxlength]="fileNameMaxLength"
        autocomplete="off"
        spellcheck="false"
        aria-required="true"
        [attr.aria-invalid]="
          (form.controls.fileName.touched || form.controls.fileName.dirty) &&
          form.controls.fileName.invalid
        "
      />
    </app-form-field>

    <div class="module-export__actions">
      <!--
        BOTH ACTIONS ARE REAL BUTTONS. `export.ascx:L15-L16` declared them as link buttons, which render
        as anchors - elements that navigate rather than act, are announced as links, and are not
        activated by the space key.
      -->
      <button type="submit" [disabled]="exporting() || !hasModuleToExport"
          [attr.aria-busy]="exporting() ? 'true' : null">{{ exportLabel }}</button>

      <!-- `type="button"` is the faithful translation of `causesvalidation="False"` on `export.ascx:L16`. -->
      <button type="button" (click)="cancel()">{{ cancelLabel }}</button>
    </div>
  </form>
</section>
