<!-- THE PAGE TITLE. -->
<app-page-header title="User Log In" />

<!--
  ⚠ IF THIS SCREEN DOES NOT RENDER THE REFUSAL, NOBODY DOES. The bearer-token interceptor lists the
  sign-in endpoint among the anonymous ones, so no credential is attached and no renewal is attempted;
  the error interceptor then returns early on exactly 401, deliberately, because a sign-in refusal is
  this screen's to explain and announcing it globally as well would report it twice.
-->
<app-error-banner [problem]="problem()" />

@if (failed()) {
  <div class="login__failure">
    @if (rateLimited()) {
      <p class="login__notice" role="status">{{ rateLimitMessage }}</p>
    } @else if (signInMessage() !== null) {
      <p
        class="login__message"
        [attr.role]="signInMessageEchoedAtField() ? null : 'alert'"
        [attr.aria-hidden]="signInMessageEchoedAtField() ? 'true' : null"
      >
        {{ signInMessage() }}
      </p>
    }

    <!--
      Dead markup is worse than absent markup: it cannot be exercised by a specification, so it rots
      unnoticed. The reference is therefore rendered by the shared banner alone, which is the one
      component that has the document to read it from.
    -->

    <!--
      A real `button` with an explicit type, so it can never submit the form below it. It clears the
      recorded failure and deliberately does NOT retract the verification field: dismissing a message
      must not withdraw a box the person is being asked to fill in.
    -->
    <button class="login__dismiss" type="button" (click)="dismissFailure()">Dismiss</button>
  </div>
}

<!--
  ⚠ THIS SCREEN IS THE ONLY THING THAT RENDERS IT, AND THE STORE SAYS SO IN AS MANY WORDS.
  `core/state/auth.store.ts` publishes the flag with the note that it "exists so the sign-in screen can
  say so.
-->
@if (revocationOutstanding()) {
  <p class="login__notice" role="status">{{ revocationMessage }}</p>
}

<form class="login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="login__fields">
    <!--
      MIGRATION: the required marker and the required message are NET ADDITIONS. All 37 lines of legacy
      markup declared no validator control, so the legacy screen posted whatever was typed and let the
      server refuse it; the MECHANISM changes while the BEHAVIOUR does not, since an empty box still
      cannot complete a sign-in.
    -->
    <app-form-field
      label="User Name:"
      help="Enter your User Name below"
      [for]="controlIds.username"
      [required]="true"
      [error]="usernameMessages()"
    >
      <input
        class="login__control"
        type="text"
        [id]="controlIds.username"
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
        [attr.maxlength]="usernameMaxLength"
        [attr.aria-invalid]="isRejected('username') ? 'true' : null"
      />
    </app-form-field>

    <!--
      THE VERIFICATION CODE. Legacy `txtVerification`, `Login.ascx:L16`, in the row pair
      `rowVerification1` / `rowVerification2` that L12 and L15 both declare `visible="false"`.
    -->
    @if (verificationRequired()) {
      <app-form-field
        label="Verification Code:"
        help="Enter the verification code. You should have received the verification code on the email address used when registering"
        [for]="controlIds.verificationCode"
        [required]="true"
        [error]="verificationMessages()"
      >
        <input
          class="login__control"
          type="text"
          [id]="controlIds.verificationCode"
          formControlName="verificationCode"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          required
          [attr.aria-invalid]="isRejected('verificationCode') ? 'true' : null"
        />
      </app-form-field>
    }

    <!--
      `autocomplete="current-password"` is the standard token for this field and is a net addition. It
      asks the BROWSER's own credential manager to fill the box; no code in this workspace reads,
      copies, stores or logs the value, and no web storage of any kind is touched.
    -->
    <app-form-field
      label="Password:"
      help="Enter your Password below"
      [for]="controlIds.password"
      [required]="true"
      [error]="passwordMessages()"
    >
      <input
        class="login__control"
        type="password"
        [id]="controlIds.password"
        formControlName="password"
        autocomplete="current-password"
        required
        [attr.aria-invalid]="isRejected('password') ? 'true' : null"
      />
    </app-form-field>
  </div>

  <!--
    THE SUBMIT ROW. Legacy `cmdLogin`, `Login.ascx:L34`, captioned from `cmdLogin.Text` in the control's
    own resource file - "Login" - verbatim.
  -->
  <div class="login__actions">
    <button
      class="login__submit"
      type="submit"
      [disabled]="submitting()"
      [attr.aria-busy]="submitting() ? 'true' : null"
    >
      Login
    </button>

    @if (submitting()) {
      <app-loading-spinner size="small" label="Signing in…" />
    }
  </div>
</form>
