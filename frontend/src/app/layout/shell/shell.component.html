<!--
  THE APPLICATION SHELL TEMPLATE

  Composes the fixed regions of every administration screen around the routed
  outlet. This is the ONLY template in the workspace that renders an outlet, and the
  only one that renders the main landmark.

  STRUCTURAL CONTRACT — exactly five element children of the component host, in this
  order, each carrying the grid area published by `src/styles/_layout.scss`:

    1. the skip link                 area `skip`
    2. the banner component          area `header`
    3. the secondary navigation region   area `sidebar`
    4. the main region               area `main`
    5. the footer component          area `footer`

  The region classes go on the shell's DIRECT children. The host itself is the grid
  container — it carries `.shell` from the component's host metadata — so NO wrapper
  element may be interposed here: a wrapper would sever the parent-child
  relationship the grid depends on, and every region would stack at full width
  regardless of viewport. Two of the five children are component hosts that render
  their real landmark element inside themselves, which is why the region classes
  carry no element assumption of their own.

  SOURCE ORDER IS TAB ORDER. Every region is placed explicitly by its grid area, so
  visual position is the stylesheet's decision and is never a reason to reorder this
  file. Source order is what the Tab key follows and what a screen reader in
  document-order mode follows, which is why the skip link is first and the footer
  band is last.

  NO CONTROL FLOW. The composition is static — no condition, no repetition, nothing
  to track. Speculative structure is out of scope.
-->

<!-- MIGRATION: skin-load diagnostics are not reproduced. A failure was caught
     (L227-L237), surfaced only to portal or page administrators behind an explicit

<!-- MIGRATION: the localisation mechanism is not ported. Legacy wording came from
     resource documents keyed by control identifier and property name — a construct
     of the retired presentation framework — so wording is authored directly in
     templates here, with those documents serving only as the authoritative
     reference for the English text. A translation runtime is out of scope. Note also
     that legacy resource text is UNTRUSTED: a minority of its values contain
     escaped markup, including one live third-party script block. Such text is only

<!-- MIGRATION: the skip link is a NET ADDITION with no legacy counterpart. The
     legacy checkout contains no skip link, no accessibility attribute of any kind,
     no explicit landmark annotation on any page or user control, and no main
     element — so this is not a translation of anything, and it has no visual cost.

     A real anchor, because the address is what makes it a tab stop and what makes
     assistive technology announce it as a link. The global layout partial hides it
     with a negative focus-visible selector rather than by removing it from the
     layout, so it stays in the tab order while invisible.

     ⚠ THE FRAGMENT IS DELIBERATELY NOT ALLOWED TO RESOLVE. Activation is handled and
     the default action cancelled, because a fragment-only address resolves against
     the document's BASE url — the static document declares a root base, which deep
     links require — rather than against the address showing. From any route below
     the root it therefore names a DIFFERENT PATH, and letting it resolve performs a
     full document reload that discards the current screen. That was measured in a
     real browser against the production bundle, not inferred. The component
     documents the two alternatives that were rejected: a router link with a fragment
     navigates without reloading but moves NO focus, which is the one thing this
     affordance exists to do, and removing the root base would fix the resolution and
     break deep linking. The address is kept regardless, for the two reasons above. -->
<a class="shell__skip-link" [href]="skipLinkTarget" (click)="focusMainRegion($event)">Skip to main content</a>

<app-header
  class="shell__header"
  [applicationName]="applicationName"
  [userName]="userName"
  [signingOut]="signingOut"
  (signOut)="onSignOut()"
/>

<!-- MIGRATION: the secondary navigation region is NET-NEW information architecture,
     and the evidence matters because the opposite assumption is so natural. The only
     complete skin put its menu at L42-L47 as a navigation control declared with a
     horizontal orientation, resolved through a swappable provider and configured by
     ELEVEN separate node-class attributes plus a child-indicator setting, nested
     four elements deep inside the header band (L38-L41) and sharing that band with
     the search control (L49) — a horizontal bar, not a vertical rail. A second
     horizontal navigation surface rendered a root-level link list in the footer band
     (L109). The decisive evidence is L89: the left pane was a table cell inside the
     content table, hidden by default, that an administrator could drop modules into
     — a content pane, never a navigation region — and `portal.css` L24 defines its
     class with an empty body. So the vertical rail this region exists for
     corresponds to nothing in the legacy layout; it is a decision of this migration.
     The legacy menu control itself is not reproduced: the navigation-provider family
     and the menu control library are both excluded, so there is no provider
     indirection, no per-node class vocabulary, no fly-out submenu and no child
     indicator.

     ⚠ THE REGION IS A PROJECTION SLOT, NOT A COMPONENT REFERENCE, AND THAT IS
     DELIBERATE. The rail is supplied as projected content by whichever component
     mounts this shell, so the shell holds no knowledge of what navigation exists.
     Four files independently fix this arrangement: the component's own import list
     omits the rail and documents why, the layout partial records this exact markup as
     the intended shape, the rail's own documentation publishes this slot as its
     mounting contract, and two specifications assert the region renders empty by
     default. Whoever supplies the rail projects it from the mounting component and
     updates those expectations in the same change; this file needs no edit for it.

     Consequently the region renders empty today and the stylesheet collapses it with
     an `:empty` branch, so it contributes no width and is not announced as a
     nameless landmark. ⚠ KEEP THIS ELEMENT ON ONE LINE: `:empty` matches only when
     the element has NO child nodes at all, text nodes included, so breaking the tag
     across lines would defeat the collapse. The region writes no landmark and no
     accessible name of its own, leaving both to whatever is projected. -->
<div class="shell__sidebar"><ng-content /></div>

<!-- MIGRATION: the main landmark is a NET ADDITION. No legacy page emitted one; the
     legacy content region was the hidden table cell at index.ascx L91, whose class
     `portal.css` L27 also defines with an empty body. A native element is used
     rather than a generic element carrying an explicit landmark annotation, for two
     reasons that agree: the accessibility tree is then correct without a single
     attribute, and the component stylesheet selects the bare element name.

     `tabindex="-1"` makes the region programmatically focusable WITHOUT adding it to
     the tab order, which is what lets the skip link actually move focus rather than
     only scroll the viewport. Without it, some browsers scroll but leave focus
     behind and the next Tab press returns the user to the banner. -->
<main [id]="mainRegionId" class="shell__main" tabindex="-1">
  <!-- The application's notification surface, mounted here rather than as a sixth
       shell region for two reasons. It must survive navigation — a queue rendered by
       a routed component would be destroyed by the very navigation an announcement
       so often accompanies — and it must contribute NOTHING while it is empty, which
       a grid region with its own track could not promise. Its own live region is
       persistent and paints nothing until an entry arrives, so on a quiet screen
       this element occupies no space at all.

       It sits ABOVE the outlet so an announcement is the first thing in the main
       region rather than something to scroll for, and INSIDE the main region so it
       is part of what the skip link moves focus to. -->
  <app-notification-list />

  <!-- MIGRATION: this single outlet replaces the single server placeholder at
       `Default.aspx` L25 — a one-for-one substitution of the application's sole
       injection point. Where the legacy page resolved a control and added it
       imperatively on every request (L590), the router resolves the screen
       declaratively and lazily. This is the ONLY outlet in the workspace: the root
       template mounts this shell as its one element and renders no outlet of its
       own. -->
  <router-outlet />
</main>

<app-footer class="shell__footer" />
