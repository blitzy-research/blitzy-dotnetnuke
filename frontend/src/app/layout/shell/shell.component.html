<!--
  MIGRATION: the skip link is a NET ADDITION with no legacy counterpart. The legacy checkout contains no
  skip link, no accessibility attribute of any kind, no explicit landmark annotation on any page or user
  control, and no main element — so this is not a translation of anything, and it has no visual cost.
-->
<a
  class="shell__skip-link"
  [href]="skipLinkTarget()"
  (click)="focusMainRegion($event)"
  >Skip to main content</a
>

<!-- THE THREE BINDINGS BELOW ARE THE WHOLE OF THE SESSION SEAM, AND EACH FORM IS LOAD-BEARING. -->
<app-header
  class="shell__header"
  [applicationName]="applicationName"
  [userName]="userName()"
  [accountProfileLink]="accountProfileLink()"
  [accountPasswordLink]="accountPasswordLink()"
  [signingOut]="signingOut()"
  (signOut)="onSignOut()"
/>

<app-sidebar
  class="shell__sidebar"
  [hostAccount]="hostAccount()"
  [administersTenant]="administersTenant()"
  [editsContent]="editsContent()"
/>

<!--
  MIGRATION: the main landmark is a NET ADDITION. No legacy page emitted one; the legacy content region
  was the hidden table cell at index.ascx L91, whose class `portal.css` L27 also defines with an empty
  body.
-->
<main [id]="mainRegionId" class="shell__main" tabindex="-1">
  <!--
    The application's notification surface, mounted here rather than as a sixth shell region for two
    reasons.
  -->
  <app-notification-list />

  <!--
    This single outlet replaces the single server placeholder at `Default.aspx` L25 — a one-for-one
    substitution of the application's sole injection point. Where the legacy page resolved a control and
    added it imperatively on every request, the router resolves the screen declaratively and lazily.
  -->
  <router-outlet />
</main>

<app-footer class="shell__footer" />
