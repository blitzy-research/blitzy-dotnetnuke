<!--
  A plain div, and deliberately not a section: a section maps to a region landmark once it
  carries an accessible name and to a nameless region otherwise, so either spelling would add
  a second landmark to a screen that already has one.
-->
<div class="empty-state">

  <span class="empty-state__glyph" aria-hidden="true">
    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.5"
         stroke-linecap="round"
         stroke-linejoin="round">
      <path d="M3 7h18v12H3z" />
      <path d="M3 7l2-3h14l2 3" />
      <path d="M9 13h6" />
    </svg>
  </span>

  <!--
    The heading level follows the component's ROLE, which is the caller's to declare.

    Level two is the default and covers every in-page use: the page-header component owns the
    page-level heading on those screens, so a level-one heading here would give each of them a
    second one. The one caller that IS the whole screen - the route table's unmatched-address
    fallback, which has no page header above it - asks for level one, because a document whose
    only heading is a level two has a broken outline and a review measured exactly that.

    Written as two elements rather than one dynamic tag because a heading level cannot be
    interpolated; the class and the wording are identical in both branches, so only the level
    differs and neither branch can drift in appearance from the other.
  -->
  @if (standalone) {
    <h1 class="empty-state__title">Nothing to Display</h1>
  } @else {
    <h2 class="empty-state__title">Nothing to Display</h2>
  }

  <!--
    Interpolation escapes by default, which is what makes untrusted wording safe to render here.
    No live-region or alert semantics: an empty state is steady-state content rather than a
    change, so announcing it would interrupt without informing.
  -->
  <p class="empty-state__message">{{ message }}</p>

  <!--
    The action is the caller's to supply, which keeps this component free of any assumption about
    what it does or whether the current user may perform it. The wrapper is unconditional and the
    stylesheet owns collapsing it when nothing is projected; guarding it here would need a content
    query and would duplicate a decision made there.
  -->
  <div class="empty-state__actions">
    <ng-content />
  </div>

</div>
