<!--
  A plain div, and deliberately not a section: a section maps to a region landmark once it carries an
  accessible name and to a nameless region otherwise, so either spelling would add a second landmark to
  a screen that already has one.
-->
<div class="empty-state">

  <span class="empty-state__glyph" aria-hidden="true">
    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.5"
         stroke-linecap="round"
         stroke-linejoin="round">
      <path d="M3 7h18v12H3z" />
      <path d="M3 7l2-3h14l2 3" />
      <path d="M9 13h6" />
    </svg>
  </span>

  <h2 class="empty-state__title">Nothing to Display</h2>

  <!-- Interpolation escapes by default, which is what makes untrusted wording safe to render here. -->
  <p class="empty-state__message">{{ message }}</p>

  <!--
    The action is the caller's to supply, which keeps this component free of any assumption about what
    it does or whether the current user may perform it.
  -->
  <div class="empty-state__actions">
    <ng-content />
  </div>
</div>
