<!--
  app-page-header - the page title and action bar of the in-repository shared
  component library (plan section 0.3.2, row 2: "Page title and action bar ...
  Props/Inputs title, subtitle; content slot for actions").

  PROJECT STANDARDS: the project rules review reports that NO user-specified
  rules exist. Completeness is established by the RANGES read rather than by a
  count of calls - the default window, a whole-document range, and a window
  beginning past line 1 all returned the same single line, so a document with a
  body would have answered that last window differently. No rules document and
  no coding-standards document is assumed, invented or implied here, and their
  absence is not treated as licence to lower the bar. This template holds
  instead to the plan's own normative sections, which section 0.8.2 gives
  rule-force, and to the enterprise baseline of section 0.8.3. The precedence
  order applied throughout is section 0.3.5: design-system compliance, then
  visual continuity with the legacy portal, then accessibility, then responsive
  behaviour, then code quality.

  CLASS-NAME CONTRACT, shared verbatim with page-header.component.scss - the
  block "page-header" with the four elements "page-header__text",
  "page-header__title", "page-header__subtitle" and "page-header__actions".
  Nothing else is emitted and no modifier class exists, because the component
  declares no variants. Every value those selectors resolve to must be a design
  token; this template contributes no styling of its own, and carries no inline
  style attribute, no identifier selector and no presentational attribute.

  API consumed, and nothing beyond it: the two string members declared on the
  paired component class. Both are plain properties rather than reactive
  primitives, so both are read directly. No pipe, no directive, no service, no
  routing state and no build-time configuration value is referenced, and that
  is why the paired class can legitimately declare an empty imports array -
  plain elements and the built-in control-flow blocks require no imported
  selector under strict template checking.
-->

<!--
  MIGRATION: no landmark element is emitted here, and that is deliberate rather
  than an oversight - the name of this component invites exactly the wrong
  instinct. The banner, navigation, main and contentinfo landmarks belong
  exclusively to frontend/src/app/layout/**, where the application shell owns
  them together with the routed outlet. This component always renders inside the
  main region, so emitting a second banner landmark - whether as an element or
  as an explicit banner role - would be an accessibility defect rather than an
  improvement, and none of the nine components in this shared library emits a
  landmark. The legacy precedent agrees exactly: the shared legacy title control
  Website/controls/sectionheadcontrol.ascx wraps its title in a bare div at
  L2-L5, with no landmark element of any kind. A plain, non-landmark container
  plus a real heading element is therefore the correct translation.
-->
<div class="page-header">
  <div class="page-header__text">
    <!--
      MIGRATION: the title is promoted from a plain legacy label to a real
      level-1 heading element, and the level is fixed at 1 and documented here
      so that feature screens can compose a coherent outline beneath it. This is
      a genuine divergence measured against a baseline of literal zero: across
      the 39 in-scope admin screens under Website/admin/{Portal,Users,Security,
      Modules,Tabs}/ there are 0 heading elements of any level and 0 ARIA
      attributes, and across all 34 stylesheets under Website/ there are 0 focus
      declarations and 0 outline declarations. The legacy title was a label in
      three independent places - sectionheadcontrol.ascx L4 (a label with the
      identifier lblTitle), the skin container's title skin-object, and
      Website/admin/Containers/title.ascx's editable label. Accessibility
      outranks visual continuity in the precedence order, which is what
      authorises the promotion; and the promotion is free of visual cost anyway,
      because the measured font size is the same 20 units in all three relevant
      rules of Website/Portals/_default/default.css - the legacy module-title
      class at L65-71, the generic level-1 rule at L488-494 and the generic
      level-2 rule at L496-502. Only the colour differs, and the token vocabulary
      already carries a heading-colour token for precisely this element. The
      title is NOT a styled div dressed up as a heading, and there must never be
      two instances of this component on one screen.

      COORDINATION NOTE, reported and not acted upon: layout/** owns the
      application shell. If that shell also renders a level-1 heading for the
      site brand, a page would carry two of them. The page title inside the main
      region is the correct owner of level 1, so nothing is changed here and
      layout/** is not edited.

      MIGRATION: titles arrive already resolved. The legacy convention produced
      22 distinct mode-qualified title keys across the 37 in-scope resource
      files - the empty-mode key ten times (the portals screen resolves to
      'Portals'), the edit-mode key five times (the edit-roles screen resolves
      to 'Edit Security Roles', a file from which the empty-mode key is absent
      because each resource file carries only the modes its own screen
      supports), one key with no value-suffix at all, and one mode name
      containing a space. Mode resolution therefore stays in the feature: this
      component takes a plain resolved string, maps no keys, models no modes and
      consults no routing state.

      MIGRATION: the input name collides with the global HTML advisory-text
      attribute. The name is kept because the fixed shared-library API mandates
      it, and the value is never published to the host element - this template
      binds nothing to that attribute, and the paired class strips it from the
      host outright, so no native tooltip and no spurious accessible name can
      appear. The legacy portal offered no such tooltip either: across the 39
      in-scope admin screens the title carries no advisory-text attribute
      anywhere.
    -->
    <h1 class="page-header__title">{{ title }}</h1>

    <!--
      MIGRATION: the subtitle is supporting text, never a second heading, so it
      renders as a paragraph and stays out of the document outline. The legacy
      precedent is exact - editroles.ascx L17-18 and L75-76 render their
      supporting sentences ('In this section, you can set up the basic settings
      for this role.' and 'In this section, you can set up more advanced
      settings for this role.') through plain labels carrying the legacy
      body-text class, never through a heading. Promoting either to a
      second-level heading would invent an outline the legacy screens never had.

      The guard is a truthiness test rather than a defined-or-not test on
      purpose: the member is optional, so an absent value renders nothing, and
      an empty or omitted string renders nothing either instead of leaving a
      blank paragraph occupying vertical space and adding an empty node to the
      accessibility tree. Interpolation of an absent value yields the empty
      string, so the words "null" and "undefined" can never surface as visible
      text.
    -->
    @if (subtitle) {
      <p class="page-header__subtitle">{{ subtitle }}</p>
    }
  </div>

  <!--
    MIGRATION: the slot holds N actions, not one, and collapses to nothing at
    zero. Measured across the 37 in-scope resource files: 19 action-suffixed
    keys spread over exactly 8 screens, distribution {1 action: 4 screens, 3: 2,
    4: 1, 5: 1} - so half the action-carrying screens carry more than one, and
    the measured maximum is FIVE, on the manage-users screen ('Manage Roles for
    this User', 'Add New User', "Manage User's Profile", "Manage User's
    Password", 'Manage Profile Properties'). The portals screen carries three
    ('Add New Portal', 'Export Portal Template', 'Delete Expired Portals'). One
    unnamed slot therefore covers every case: nothing is enumerated, counted or
    capped, no selector is used, no content query is declared and no third input
    is added. Collapse-at-zero is achieved entirely in the stylesheet, because a
    wrapper carrying no padding, no border and no background occupies no space
    when nothing is projected into it - which is both simpler and sturdier than
    an empty-element selector or projected-content state.

    MIGRATION: provenance of the slot. The action-suffixed resource keys were
    literally the command names of the legacy skin container's action buttons,
    so this slot replaces that container action row exactly.

    MIGRATION: three affordances are deliberately kept apart, because conflating
    them is the obvious mistake here. (a) Page-level actions - the
    action-suffixed keys above - project into this slot. (b) An in-page form
    action bar does NOT: editroles.ascx L178-L190 is a plain paragraph holding
    four link buttons in the legacy admin text-link action class - Update,
    Cancel, Delete and Manage Users, the first three declaring no border - and
    that bar belongs to the consuming feature's own form footer. The same
    pattern occurs in 11 of the 39 in-scope screens at exact attribute case,
    34 references in total, concentrated in the site-settings screen (13) and
    the manage-pages screen (7). (c) Per-row grid commands do NOT either:
    portals.ascx L21 and L22 declare image command columns for Edit and Delete
    keyed on the portal identifier, and those belong to the shared data table,
    as does the letter-filter repeater at portals.ascx L4-L11. This component
    must not become a form-footer component and must not grow row commands.

    MIGRATION: the legacy separators become spacing tokens, never
    non-breaking-space text nodes. Measured: editroles.ascx L181, L184 and L187
    are literal non-breaking-space text nodes on their own lines between the four
    link buttons, portals.ascx L8 separates each letter-filter link with two of
    them, and the legacy skin container prefixes its title skin-object with one.
    Spacing here is a gap declared once in the stylesheet against the shared
    spacing scale, so it is inspectable and adjustable rather than smuggled into
    the markup as content.

    MIGRATION: the legacy admin action affordance is retained as a text link and
    is NOT promoted to a filled button. A filled-button class existed separately
    in default.css from L475 onward and the admin action bars deliberately did
    not use it, so promoting them would be an unrequested visual change. The
    appearance of the actions is delegated to the consumer, because projected
    content keeps the style scoping of the component that declares it - this
    component therefore cannot and must not style what it hosts, and neither
    deep-descendant piercing nor disabling the per-component scoping is
    acceptable. One measured collision is recorded rather than absorbed: the
    legacy hover colour of that text-link class (default.css L462-466) is the
    very same value the token vocabulary assigns to the danger role, which it
    also uses for error text, so action hover resolves to the primary-hover
    token instead.

    MIGRATION: every action must carry a discernible accessible name, and this
    is a legacy-wide gap rather than a one-off. Positive precedent: roles.ascx
    L11 gives its edit image both an alternate text and a resource key, and the
    portals resource file carries the richer wording 'Edit this Portal'.
    Negative precedent, measured: roles.ascx L13 declares its delete image
    button with NEITHER an alternate text nor a resource key, and the portals
    resource file has no delete wording key at all among its 17 entries even
    though portals.ascx L22 renders a delete action - so the word 'Delete' has
    to be authored directly, and the gap is recorded here. The same defect class
    recurs at roles.ascx L68-L69 and L74-L75 and at users.ascx L76-L77, where
    images carry no alternate text whatsoever. Because the actions are projected
    by the feature, this is a documented obligation on consumers rather than
    something this template can enforce - stated plainly rather than pretended
    otherwise. What this template does guarantee is that it wraps the projected
    actions in a plain container that suppresses no accessible name, and that it
    invents no ARIA: no toolbar role is applied, because a toolbar role imposes
    arrow-key management obligations that neither this component nor the
    projected actions implement, and declaring ARIA that is not implemented is
    worse than declaring none. Visible focus indication for those actions is a
    focus-visible concern of the stylesheets, never an outline suppression.

    MIGRATION: raster action icons are replaced by text, inline SVG or CSS. The
    twelve legacy assets involved - the edit, delete, save, refresh, up, down,
    checked, unchecked, help, users, security-roles and search images under
    Website/images - have no target equivalent, and the only static asset this
    workspace ships is a favicon, so no component may reference an image asset.

    MIGRATION: wording resolution rule - the resource value wins WHERE THE KEY
    EXISTS, and where the key is absent the markup text attribute is the only
    wording available and must be authored directly with the gap recorded. The
    edit-roles resource file proves both halves at once, across its 42 parsed
    entries: the manage key carries the richer 'Manage Users in this Role'
    against the markup's "Manage Users", while the update, cancel and delete
    keys are absent from that file entirely. Two validator messages are exactly
    swapped between markup and resource file, with the declared comparison
    operator as arbiter - editroles.ascx L112-L114 reads "... Greater Than or
    Equal to Zero" in markup but declares a strictly-greater operator, while
    L126-L128 reads "... Greater Than Zero" in markup but declares a
    greater-or-equal operator; in both cases the resource wording matches the
    operator, which is what makes the resource file authoritative. Those
    validator keys carry the ordinary value suffix, not an error-message suffix.

    MIGRATION: the wording source cannot be trusted as markup, so both inputs
    are rendered as plain text through interpolation only - never through a
    raw-HTML property binding, never through a sanitiser bypass, never through
    a trusted-HTML wrapper type, and never by smuggling markup through an
    attribute binding. Measured across the 37 in-scope resource files: 76 values
    contain an HTML tag and 29 of them open with a line-break tag, including all
    nine validator messages on the edit-roles screen, which is layout smuggled
    into a string. The per-value tag histogram is line-break 39, paragraph 24,
    level-1 heading 21, bold 10, anchor 5, list-item 3, span 2, list 2, script
    1, level-3 heading 1, level-4 heading 1 and strong 1. The decisive proof is
    a single 344-character value on the portal site-settings screen, keyed
    Advertising, carrying a live advertising script tag whose source is a remote
    third-party host - a value invisible to a naive search because the tags are
    stored HTML-escaped. The portals screen's module-help value similarly opens
    with a heading tag followed by a paragraph tag. DENOMINATOR HONESTY: those
    files yield 1211 raw textual data-entry occurrences against 1111 parsed
    data elements, the gap of 100 being entries sitting inside XML comments,
    which a parser drops; a circulating figure of 1182 is a partial parse
    between the two. The count of 76 HTML-bearing values is unanimous across all
    three readings. Where a screen genuinely needs rich introductory content,
    the feature re-authors it as real template markup - it is never injected.

    MIGRATION: localisation is not ported. No translation runtime is present in
    the pinned dependency surface and no message-tagging attribute or
    message-tagging helper is used anywhere; user-facing strings are authored
    directly into templates, and the 37 resource files informed wording only.

    MIGRATION: the legacy collapsible-section affordance is NOT this component's
    concern, permanently and by design rather than deferred. The legacy
    section-head control appears on 9 of the in-scope screens (41 opening tags:
    module settings, signup, site settings, edit roles, manage pages, recycle
    bin, password, user settings and bulk email). Its section attribute names a
    target element identifier, which is the legacy equivalent of an aria-controls
    reference - proven because editroles.ascx L11-L12 targets "tblBasic" and
    L68-L70 targets "tblAdvanced", and real elements bearing exactly those two
    identifiers exist at L13-L14 and L71-L72 - and its expanded attribute is
    false on the advanced block, meaning collapsed by default. A keyboard
    reachable disclosure carrying aria-expanded and aria-controls is therefore a
    faithful translation rather than an invention, and the legacy toggle's
    negative tab index (sectionheadcontrol.ascx L3) is an accessibility defect to
    reverse, not to reproduce. That disclosure belongs to the FEATURE screens as
    a grouped field set with a caption, or as a native details-and-summary
    disclosure where collapse is genuinely required. This component grows no
    toggle, gains no third input and does not become a section component,
    because the shared inventory is closed at ten - the nine components plus the
    permission directive.
    REPORTED, NOT ACTED UPON: the planned global layout stylesheet's brief
    misattributes this disclosure fix to page-header. It is recorded here and
    left alone.

    MIGRATION: the legacy title block also drew a horizontal-rule element
    beneath the title - sectionheadcontrol.ascx L6-L8 emits one inside a panel,
    gated by an include-rule attribute that both edit-roles section heads set to
    true. No rule element is emitted here. A separator, where the design calls
    for one, is a border declared against the token vocabulary in the paired
    stylesheet, because a rule drawn in markup is presentation masquerading as
    content and cannot respond to the surrounding layout.

    MIGRATION: section-level introductory text is a distinct layer and is not a
    page-header concern. editroles.ascx L17-L18 and L75-L76 place their
    supporting sentences inside the grouped block they describe, not beside the
    page title, so the target equivalent is a paragraph inside the feature's own
    grouped field set. Noted for the record: the legacy naming of that pair is
    inconsistent - one key is suffixed as a description and the other as help,
    for the same role on the same screen.
  -->
  <div class="page-header__actions">
    <ng-content />
  </div>
</div>
