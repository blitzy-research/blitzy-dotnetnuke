<!-- PAGE NAVIGATION FOR A LIST SCREEN. -->

<!--
  MIGRATION: splitting the two states apart is a documented divergence from the legacy PORTALS screen
  and a return to the legacy USERS screen; the reasoning, with both authorities, is on `isRendered` in
  the paired class.
-->
@if (isRendered) {
  <!--
    A NAMED GROUP, NOT A LANDMARK. The controls carry a discernible accessible name, so a person using
    assistive technology knows what the cluster is, but the element is deliberately not a landmark and
    no `nav` is emitted anywhere in this file: landmarks belong to the application shell in `layout/**`,
    which already renders the site's single navigation landmark.
  -->
  <div class="pagination" role="group" [attr.aria-label]="labels.region">
    <!--
      THE RANGE SUMMARY, and a live region. A page change replaces the list contents without moving
      focus, so without an announcement a screen-reader user has no signal that anything happened.
    -->
    <!--
      ⚠ `aria-busy` HOLDS THE ANNOUNCEMENT UNTIL THE NUMBERS ARE THE PAGE'S OWN. The wording above is
      composed from the page that was ASKED for, so it updates the instant a step is pressed - which is
      right for the eye and wrong for the ear.
    -->
    <!--
      ⚠ VISIBLE, NOT ANNOUNCED, AND THE REMOVAL OF `aria-live` IS THE FIX. This carried `aria-live="polite"`
      and `aria-atomic="true"` while the table's own `role="status"` region carried the record count with the
      same politeness - so ONE action produced TWO polite announcements with an intervening blank, and a
      screen reader read the range and the count as if they were unrelated events. The table's region is now
      the single announcer and states the dataset total itself, so nothing is lost by this region falling
      silent. It keeps its text, its class and its position, so nothing changes for the eye.
    -->
    <p class="pagination__status">
      {{ firstItemNumber }}&ndash;{{ lastItemNumber }} of {{ totalCount }}
    </p>

    <!-- THE STEPS, only when there is somewhere to step to. -->
    @if (isNavigable) {
      <div class="pagination__controls" role="group" [attr.aria-label]="labels.steps">
        <!--
          THE FOUR STEPS, in the legacy control's own order: first, previous, then the readout in the
          slot the page links occupied, then next and last.
        -->
        <!--
          ⚠ UNAVAILABILITY IS STATED WITH `aria-disabled`, NOT THE NATIVE PROPERTY, AND THE MEASUREMENT
          BEHIND THAT IS THE WHOLE REASON THIS COMMENT EXISTS. With the native attribute the step was
          removed from the keyboard entirely: measured on the first page, `firstButton.focus()` left
          `document.activeElement` unmoved and the control was ABSENT from the tab order, while the same
          call on the available Next step moved focus correctly - so the method was sound and the button
          genuinely unreachable. A keyboard user tabbing the pager could not reach First or Previous at
          all, and therefore was never told they existed or why they were unavailable.
          `_forms.scss` already declares the `aria-disabled` appearance and states the preference in the
          same terms: a control a keyboard user can reach and hear announced as unavailable beats one that
          has silently vanished. The rendered appearance is unchanged by this - the same three non-colour
          cues carry the state, ink, border and cursor - so nothing is lost for the eye.

          ⚠ THE HANDLERS MUST ENFORCE WHAT THE ATTRIBUTE ANNOUNCES. `aria-disabled` is a statement to
          assistive technology and nothing more: the element still activates, from a pointer and from
          Enter or Space. `goFirst` and its siblings therefore refuse the step themselves, which is the
          enforcement the native property used to supply for free.
        -->
        <button
          class="pagination__button"
          type="button"
          [attr.aria-disabled]="canGoPrevious ? null : 'true'"
          [attr.aria-label]="labels.first"
          (click)="goFirst()"
        >
          <span aria-hidden="true">{{ labels.firstSymbol }}</span>
        </button>

        <button
          class="pagination__button"
          type="button"
          [attr.aria-disabled]="canGoPrevious ? null : 'true'"
          [attr.aria-label]="labels.previous"
          (click)="goPrevious()"
        >
          <span aria-hidden="true">{{ labels.previousSymbol }}</span>
        </button>

        <!--
          THE POSITION READOUT. Text rather than a control: there is nothing to activate, and a disabled
          button here would put an unusable stop in the tab order.
        -->
        <span class="pagination__position" aria-current="page">{{ displayPage }} / {{ totalPages }}</span>

        <button
          class="pagination__button"
          type="button"
          [attr.aria-disabled]="canGoNext ? null : 'true'"
          [attr.aria-label]="labels.next"
          (click)="goNext()"
        >
          <span aria-hidden="true">{{ labels.nextSymbol }}</span>
        </button>

        <button
          class="pagination__button"
          type="button"
          [attr.aria-disabled]="canGoNext ? null : 'true'"
          [attr.aria-label]="labels.last"
          (click)="goLast()"
        >
          <span aria-hidden="true">{{ labels.lastSymbol }}</span>
        </button>
      </div>
    }
  </div>
}
