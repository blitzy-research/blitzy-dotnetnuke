<!--
  EVERY STRING THIS TEMPLATE DISPLAYS IS INTERPOLATED PLAIN TEXT, AND THAT IS A SECURITY BOUNDARY RATHER
  THAN A STYLISTIC PREFERENCE. Measured across the 37 in-scope `App_LocalResources` resource files: of
  1111 entries, 76 carry an HTML tag and 29 open with break markup.
-->
<div class="form-field">
  <div class="form-field__label-row">
    <!-- THE CAPTION, IN ONE PLACE, RENDERED INTO ONE OF TWO ELEMENTS. -->
    <ng-template #captionContent>
      {{ labelText() }}
      @if (required) {
        <!--
          MIGRATION: a net addition. The legacy screens expressed requiredness only through a validator
          that rendered nothing until a postback failed, so there is no legacy marker convention to
          carry across.
        -->
        <span class="form-field__required">
          <span aria-hidden="true">{{ requiredMarker }}</span>
          <span class="form-field__required-text">{{ requiredText }}</span>
        </span>
      }
    </ng-template>

    @if (labelFor() !== null) {
      <label class="form-field__label" [id]="labelId()" [attr.for]="labelFor()">
        <ng-container [ngTemplateOutlet]="captionContent" />
      </label>
    } @else {
      <span class="form-field__label" [id]="labelId()">
        <ng-container [ngTemplateOutlet]="captionContent" />
      </span>
    }

    @if (hasHelp()) {
      <!--
        THE `aria-controls` DECISION, stated explicitly because there are two valid answers and only one
        is used here.
      -->
      <button
        class="form-field__help-toggle"
        type="button"
        [attr.aria-expanded]="helpExpanded()"
        [attr.aria-controls]="helpControls()"
        [attr.aria-labelledby]="helpToggleLabelledBy()"
        (click)="toggleHelp()"
      >
        <svg
          class="form-field__help-icon"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="8" cy="8" r="6.25" />
          <circle cx="8" cy="4.9" r="0.85" fill="currentColor" stroke="none" />
          <path d="M8 7.4v4.1" />
        </svg>
        <span class="form-field__help-toggle-text" [id]="helpToggleTextId()">{{
          helpToggleText
        }}</span>
      </button>
    }
  </div>

  <div
    class="form-field__control"
    role="group"
    [attr.aria-labelledby]="groupLabelledBy()"
    [attr.aria-describedby]="describedBy()"
  >
    <ng-content />
  </div>

  @if (helpExpanded()) {
    <!--
      MIGRATION: that break element is NOT reproduced. It was vertical spacing expressed as content, and
      spacing here is the stylesheet's spacing scale instead; this template emits no break element
      anywhere.
    -->
    <p class="form-field__help" [id]="helpId()">{{ helpText() }}</p>
  }

  @if (hasError()) {
    <!--
      The region is removed when the field becomes valid rather than emptied or hidden, so it neither
      occupies space nor lingers in the accessibility tree.
    -->
    <!--
      `aria-errormessage` is deliberately NOT added alongside the description. It would name the same
      region a second time, and the two mechanisms together make several screen readers announce the
      reason twice; the description is the one with dependable support.
    -->
    <div class="form-field__errors" [id]="errorId()" role="alert">
      @for (message of errorMessages(); track $index) {
        <p class="form-field__error" [id]="errorMessageId($index)">{{ message }}</p>
      }
    </div>
  }
</div>
