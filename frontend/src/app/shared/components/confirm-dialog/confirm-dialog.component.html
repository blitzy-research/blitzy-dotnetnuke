<!--
  Destructive-action confirmation dialog.

  A native `<dialog>` is the whole mechanism. The paired class opens it with
  `showModal()` in `ngAfterViewInit`, which promotes the element to the browser's
  top layer, paints the backdrop and makes the rest of the document inert. That
  is why no `z-index` and no fixed positioning appears anywhere here or in the
  paired stylesheet - the platform supplies stacking, so the workspace needs no
  stacking token for it. The element carries NO `open` attribute and is NOT
  wrapped in a control-flow block: either would leave it rendered but non-modal,
  and `showModal()` throws on an already-open dialog.

  Presence in the DOM is "open". The consumer mounts this component to ask the
  question and unmounts it in response to either output; there is deliberately no
  `open`, `visible` or `show` input to keep in sync.

  Native elements are correct INSIDE this component. The shared-component rule
  that forbids a bare control in a feature template exists because a compliant
  wrapper should be used instead - and this component IS that wrapper, so real
  `<dialog>`, `<h2>`, `<p>` and `<button>` elements belong here.

  MIGRATION: net-new affordance. The legacy mechanism was a blocking native
  `window.confirm()` injected as an inline click attribute by
  `Library/Controls/DotNetNuke.WebUtility/ClientAPI.vb` L331-333, which took
  exactly ONE argument - the message. The title, the caller-supplied confirm
  label, the severity channel, the accessible name and description, the focus
  trap and focus restoration are therefore all additions, not translations. That
  a modal confirmation is the faithful replacement is proven by
  `Website/admin/Portal/portals.ascx`: its Edit column carries `EditMode="URL"`
  (L21) while its Delete column carries none (L22), so Delete was a POSTBACK
  COMMAND rather than navigation.

  MIGRATION: the accessibility contract is net-new. The legacy admin markup
  declared no ARIA and the legacy stylesheets declared no focus styling at all.
  `roles.ascx` L13 renders its delete image button with no alternate text, no
  resource key and no text, two lines below an edit button that carries both - an
  accessibility defect proven by contrast, and fixed here by giving both
  affordances real, visible text. `ProfileDefinitions.ascx` L18, the one legacy
  delete column that did carry `Text="Delete"`, is the precedent honoured.

  MIGRATION: `~/images/delete.gif` is not ported. The only static asset this
  application ships is the favicon, so the severity glyph below is a text
  character rather than an image, and the non-breaking-space separators the legacy
  markup placed between action links are replaced by a spacing token in the
  stylesheet.

  MIGRATION: the actions are promoted from the legacy underlined text link
  (`default.css` L442-472 styled the legacy command-button rule as an underlined
  anchor) to
  real `<button>` elements, which are keyboard-activatable by both Enter and
  Space natively and carry a real hit area.

  MIGRATION: wording is plain text on every path. `title`, `message` and
  `confirmLabel` may originate from legacy resource values, which are untrusted
  markup - one in-scope entry holds live remote script blocks - so every value is
  interpolated and never bound as markup. Legacy precedent for encoding rather
  than trusting is `Website/admin/Security/AccessDenied.ascx.vb` L43 and
  `Website/Default.aspx.vb` L232. Localisation is not ported, so the cancel
  wording is authored here and no localisation attribute is emitted.
-->
<dialog
  #dialogElement
  class="confirm-dialog"
  role="alertdialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="messageId"
  (cancel)="onDialogCancel()"
  (click)="onBackdropClick($event)"
>
  <!--
    The accessible name and description are wired by id rather than inferred from
    visual proximity, and the ids come from the class so two dialogs mounted at
    once cannot collide. `role="alertdialog"` overrides the element's implicit
    dialog role deliberately: this is a destructive-action confirmation, so it
    must be announced with its name and description immediately. `aria-modal` is
    declared because the paired class's published template contract requires it
    and because it is the pattern documented for an alert dialog; it is
    redundant with the modality `showModal()` already establishes, never
    contradictory, and it costs nothing visually.
  -->
  <h2 [id]="titleId" class="confirm-dialog__title">{{ title }}</h2>
  <p [id]="messageId" class="confirm-dialog__message">{{ message }}</p>

  <!--
    Cancel comes FIRST in document order for two independent reasons. Safety: the
    class moves focus here on open, so a stray Enter or Space cannot delete
    anything, and the user agent's own first-focusable heuristic lands in the
    same place. Fidelity: `Website/admin/Security/editroles.ascx` L179-189
    renders Update, then Cancel (L182-183), then Delete (L185-186), so the
    measured legacy order already put the safe action first.

    Both affordances are explicitly `type="button"`, so neither can submit an
    ancestor form. That mirrors `CausesValidation="False"` on both legacy link
    buttons. Each click calls the class's own handler rather than emitting an
    output from the template, so the emit-once guard cannot be bypassed.
  -->
  <!-- MIGRATION: both affordances are disabled once the dialog has settled. The
       `settled` member is the component's own single-settlement guard, so the
       binding is a presentational restatement of a rule the class already
       enforces - it cannot emit a second confirm or cancel either way. It is
       declared because the paired stylesheet carries a `:disabled` rule for
       these buttons and reserves `:hover`/`:active` for `:enabled` only, so
       without it that state would be unreachable and the interactive states
       would be styling a condition the markup never produces. -->
  <div class="confirm-dialog__actions">
    <button
    #cancelButton
    class="confirm-dialog__button"
    type="button"
    [disabled]="settled"
    (click)="onCancelClick()"
  >
    Cancel
  </button>
    <button
      class="confirm-dialog__button"
      [class.confirm-dialog__button--danger]="danger"
      type="button"
      [disabled]="settled"
      (click)="onConfirmClick()"
    >
      @if (danger) {
        <!--
          Severity is signalled by more than colour: this glyph, the bold weight
          the danger modifier applies, and the affordance's own text label. The
          glyph is a text character rather than an image and is hidden from
          assistive technology, so it can neither compete with the label as a
          naming source nor announce anything twice.
        -->
        <span aria-hidden="true">⚠</span>
      }
      {{ confirmLabel }}
    </button>
  </div>
</dialog>
