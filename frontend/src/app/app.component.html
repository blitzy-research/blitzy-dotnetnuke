<!--
  THE ROOT COMPONENT TEMPLATE

  `src/main.ts` bootstraps `AppComponent` into the `app-root` element declared by
  `src/index.html`, so this file is the first markup the application renders and the
  root of everything below it.

  LEGACY LINEAGE
  --------------
  This template is the successor to ONE line of the legacy application. Every request
  was served through `Website/Default.aspx` (30 lines), and line 25 of that page —
  `<asp:PlaceHolder ID="SkinPlaceHolder" runat="server" />` — was the SINGLE injection
  point for the entire page body. The code-behind `Website/Default.aspx.vb` (700 lines)
  filled it per request: `LoadSkin` (approximately L217-L243) stripped the application
  path off the configured path, instantiated a user control from whatever it found with
  `CType(LoadControl("~" & SkinPath), Skin)` and then called `ctlSkin.DataBind()`, and
  L590 added the result to the placeholder. Mounting one static shell here is the
  one-for-one replacement of that placeholder: same role, one element, nothing else.
  Both legacy files are REFERENCE-ONLY and neither is edited by this migration.

  Also measured, because the opposite assumption is the natural one: the legacy checkout
  contains ZERO master-page files. This generation of the product composed pages from
  skins rather than master pages, so there is no master-page-to-layout mapping owed here
  or anywhere else in the workspace.

  WHY THE ROOT IS THIS THIN
  -------------------------
  The shell owns every fixed region and the router owns everything inside its outlet, so
  there is nothing for the root to add. NO wrapper element is emitted, and that is a
  requirement rather than a preference for brevity:

    * The shell's host IS the layout grid container — it carries `.shell` from its own
      host metadata and `styles/_layout.scss` keys the grid off that class. An interposed
      element would sever the parent-child relationship the grid depends on and every
      region would stack at full width regardless of viewport.
    * `app.component.scss` is written to exactly this expectation. Its own comment
      records that "the template mounts a single element", which is why it styles the
      host box and nothing else.
    * The singular landmarks — banner, main region and footer band — are each rendered
      exactly once, inside the shell. Emitting any of them here would produce a second
      definition of something that already exists, which is a real accessibility defect
      rather than untidiness.

  NO CONTROL FLOW, DELIBERATELY. There is nothing to branch on: the shell renders
  unconditionally and route-level branching is the router's job. Angular's built-in
  blocks are the workspace's only permitted control flow, and this template needs none
  of them.

  NO MARKUP IS EVER BOUND HERE OR ANYWHERE BELOW. Legacy wording lives in resource
  documents whose values include escaped markup — a minority of them, but the census
  found live script blocks among it — so that text is untrusted. It is interpolated as
  plain text only, never bound as markup, and the platform's own escaping is never
  bypassed.
-->

<!-- MIGRATION: run-time dynamic layout selection becomes ONE static, compile-time
     composition. The legacy chrome was not a component at all: `Default.aspx` L25
     declared an empty server placeholder and the code-behind chose what went into it
     per request, calling `LoadSkin` from four separate call sites depending on how
     tenant resolution had gone. The comment beside the `DataBind()` call states
     outright that it executed "any server logic in the skin", so THE LAYOUT ITSELF WAS
     EXECUTABLE SERVER CODE selected at run time. None of that survives. The single
     `app-shell` element below is the entire replacement — one class, resolved by the
     compiler, identical for every request and every tenant. There is no layout
     registry, no per-portal chrome, no theme lookup, no package override and no dynamic
     control loading, because skinning, containers and skin objects are all out of
     scope. The failure mode changes with it: a missing layout used to be a caught
     exception, revealed only to administrators behind a membership check and otherwise
     logged, whereas a missing shell is now a BUILD failure. That is why this template
     carries no error surface and no diagnostic affordance of its own. -->

<!-- MIGRATION: view state and the postback model are eliminated outright rather than
     translated. `Default.aspx` wrapped the whole document in ONE server-side multipart
     form (L23, declaring a multipart encoding type, autocomplete disabled and a
     full-height inline style) which contained a diagnostic label, `SkinError` (L24),
     hidden until a skin failed to load, and two hidden inputs whose only purpose was to
     smuggle client state across a postback: `ScrollTop` (L26), read and written through
     the code-behind's own property and re-applied on load by a body handler, and
     `__dnnVariable` (L27), the client-variable bag. NONE of the four is reproduced.
     There is no form element here, no hidden input, no view state and no round trip.
     Client state lives in signal stores, scroll position is restored by the router's own
     in-memory scrolling configured once in `app.config.ts`, and skin-load diagnostics
     have no counterpart because the defect they reported cannot reach a running
     application. The empty script-disabled element at L22 is not reproduced here either:
     it belongs to the single static document, `src/index.html`. -->

<!-- MIGRATION: the session seam below is a NET ADDITION with no legacy counterpart. The
     legacy chrome read the signed-in identity out of ambient per-request state that the
     framework made available anywhere, so no wiring was visible in the markup and no
     component published a contract for it. Here the chrome resolves nothing: the shell
     FORWARDS these three facts to the banner and re-emits the sign-out gesture, and the
     banner ends no session and navigates nowhere. This template is therefore the ONLY
     place in the workspace where the chrome meets the session store, which is what keeps
     the chain from the token custodian to the rendered name down to three links and
     leaves one authority for the decision to sign out. Signing out changes mechanism
     with it: clearing one authentication cookie used to be enough because the next
     request rebuilt every page on the server, whereas a signed bearer token cannot be
     recalled, so signing out is now revocation plus a client-side discard — and the
     discard is the part with no legacy equivalent at all. -->

<!--
  THE THREE BINDINGS ARE THE WHOLE OF THE SESSION SEAM, AND EACH FORM IS LOAD-BEARING.

  `[userName]` is a property binding and must stay one. The shell declares its input as
  optional and this component supplies `undefined` when no account is signed in, which is
  what the banner tests for in order to render no session cluster at all. An attribute
  form would pass the literal string "userName" and leave a phantom account signed in
  forever.

  `[signingOut]` likewise. The shell coerces this input from an attribute, so an attribute
  written without a value would read as `true` and permanently disable the sign-out
  control.

  `(signOut)` is subscribed exactly once, here. The coordinator behind it is cold, so a
  gesture nobody listens for revokes nothing.

  `applicationName` is DELIBERATELY NOT BOUND. The shell's input defaults to the
  build-time application name, so the banner is already correct with no binding, and
  restating the value here would create a second place it could drift from.
-->

<!--
  THE PROJECTED CHILD IS THE PRIMARY NAVIGATION RAIL, AND IT IS REQUIRED.

  The shell publishes its navigation region as a content-projection slot and assigns the
  mounting decision to whichever component mounts `app-shell`, precisely so that the
  shell holds no knowledge of what navigation exists. This is that mounting component, so
  the rail is supplied here. It is standalone, declares no input and emits nothing, so
  projecting it needs no binding.

  ⚠ DO NOT REMOVE IT. The shell's region is collapsed by an `:empty` branch in its
  stylesheet when nothing is projected — correct for a shell mounted with no navigation,
  and asserted as such by the shell's own specification — but at the application root it
  would mean shipping a console with NO navigation at all, and it would do so SILENTLY:
  nothing raises and nothing warns, the rail simply never renders. `app.component.spec.ts`
  asserts the projection precisely to close that gap.

  The region itself writes no landmark and no accessible name, leaving both to whatever is
  projected, so the rail's own labelled navigation landmark is what makes the console's
  navigation announceable to assistive technology.
-->
<app-shell
  [userName]="userName()"
  [signingOut]="signingOut()"
  (signOut)="onSignOut()"
>
  <app-sidebar />
</app-shell>
